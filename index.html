  {art:true,stride:2,desc:true,bracket:false},
  {art:true,stride:1,desc:false,bracket:false},
  {art:false,stride:2,desc:true,bracket:false},
  {art:false,stride:1,desc:false,bracket:false},
];

// Rows a variant occupies, from its first drawn row to its last list row.
function debugMenuBlockRows(variant){
  const head=variant.art?TITLE_ART.length+1:0;  // art plus the blank under it
  const gap=variant.bracket?2:1;                // blank rows under the subtitle
  const list=(DEBUG_MODES.length-1)*variant.stride+(variant.desc?2:1);
  return head+1+gap+list;                       // + the subtitle row
}

// Pick the fullest layout that fits between the borders, then place it. Every
// row the menu draws is derived from the result, so nothing lands past the
// bottom border to be silently dropped by ScreenBuffer.put.
function debugMenuLayout(h){
  const top=1,bottom=h-2;
  let variant=DEBUG_MENU_VARIANTS[DEBUG_MENU_VARIANTS.length-1];
  let blockRows=debugMenuBlockRows(variant);
  for(const candidate of DEBUG_MENU_VARIANTS){
    variant=candidate;
    blockRows=debugMenuBlockRows(candidate);
    if(blockRows<=bottom-top)break;
  }
  // Keep the familiar placement while there is room for it, and slide the block
  // up against the top border once there is not.
  const artY=max(top,min(floor(h*0.12),bottom-blockRows));
  const subY=artY+(variant.art?TITLE_ART.length+1:0);
  const menuY=subY+1+(variant.bracket?2:1);
  // The hint keeps its usual row below the list, clamped to the last row inside
  // the border so a short screen shortens the gap rather than losing the line.
  const navY=min(menuY+DEBUG_MODES.length*variant.stride+1,bottom);
  return{...variant,artY,subY,menuY,navY};
}

// True when a row is inside the border and may be drawn on.
function insideBorder(y,h){return y>=1&&y<=h-2;}

function renderTitleScreen(screen,state){
  const w=screen.width,h=screen.height;
  screen.clear(C.BLACK);
  // Starfield background, drawn first so the text sits on top of it
  drawMenuStars(screen,state,w,h);
  drawBorder(screen,w,h);
  const artY=floor(h*0.15);
  for(let i=0;i<TITLE_ART.length;i++){
    const line=TITLE_ART[i];
    if(line.length<w-4){
      const pulse=sin(state.time*2+i*0.3)*0.5+0.5;
      const color=pulse>0.5?C.BRIGHT_CYAN:C.CYAN;
      screen.putStringCenter(artY+i,line,color,C.BLACK);
    }
  }
  const subY=artY+TITLE_ART.length+2;
  const subtitle='WARP TUNNEL PROTOCOL v2.7';
  const subPulse=sin(state.time*1.5)*0.5+0.5;
  screen.putStringCenter(subY,subtitle,subPulse>0.5?C.BRIGHT_MAGENTA:C.MAGENTA,C.BLACK);
  const instY=subY+3;
  const instructions=[
    ['WASD',' or ','ARROWS',' \u2014 steer ship'],
    ['F',' \u2014 boost  |  ','SPACE',' \u2014 fire pulse cannon'],
    ['Q / E',' \u2014 barrel roll'],
    ['','Dodge obstacles \u2022 Collect energy orbs \u2022 Survive!','',''],
  ];
  for(let i=0;i<instructions.length;i++){
    const parts=instructions[i];
    let line='';for(const p of parts)line+=p;
    const x=floor((w-line.length)/2);
    let cx=x;
    for(let j=0;j<parts.length;j++){
      const color=j%2===0&&parts[j].length>0?C.BRIGHT_CYAN:C.GRAY;
      screen.putString(cx,instY+i,parts[j],color,C.BLACK);
      cx+=parts[j].length;
    }
  }
  // Start prompt (pulsing), clamped to the last row inside the border: at the
  // documented 60x20 minimum its usual row is the bottom border itself.
  const promptY=min(instY+instructions.length+3,h-2);
  const prompt='[ PRESS ENTER TO LAUNCH ]';
  const promptPulse=sin(state.time*3)*0.5+0.5;
  const promptColor=promptPulse>0.3?C.BRIGHT_GREEN:C.GREEN;
  screen.putStringCenter(promptY,prompt,promptColor,C.BLACK);
}

function renderDebugMenu(screen,state){
  const w=screen.width,h=screen.height;
  screen.clear(C.BLACK);
  // Starfield background, drawn first so the text sits on top of it
  drawMenuStars(screen,state,w,h);
  drawBorder(screen,w,h);
  const layout=debugMenuLayout(h);
  if(layout.art){
    for(let i=0;i<TITLE_ART.length;i++){
      const y=layout.artY+i;
      if(TITLE_ART[i].length<w-4&&insideBorder(y,h))
        screen.putStringCenter(y,TITLE_ART[i],C.BRIGHT_CYAN,C.BLACK);
    }
  }
  if(insideBorder(layout.subY,h))
    screen.putStringCenter(layout.subY,'DEBUG PROTOCOL v0.1',C.BRIGHT_MAGENTA,C.BLACK);
  for(let i=0;i<DEBUG_MODES.length;i++){
    const mode=DEBUG_MODES[i];
    const selected=i===state.debugMenuSelected;
    const prefix=`[${i+1}] `;
    const name=DEBUG_MODE_NAMES[mode];
    const desc=`    ${DEBUG_MODE_DESCS[mode]}`;
    const y=layout.menuY+i*layout.stride;
    const x=floor((w-40)/2);
    if(!insideBorder(y,h))continue;
    if(selected)screen.putString(x-3,y,'\u25B6',C.BRIGHT_CYAN,C.BLACK);
    screen.putString(x,y,prefix,selected?C.BRIGHT_MAGENTA:C.MAGENTA,C.BLACK);
    screen.putString(x+prefix.length,y,name,selected?C.BRIGHT_CYAN:C.GRAY,C.BLACK);
    if(layout.desc&&insideBorder(y+1,h))
      screen.putString(x,y+1,desc,selected?C.CYAN:C.GRAY,C.BLACK);
    if(selected&&layout.bracket&&insideBorder(y-1,h)){
      const bw=42,bx=x-2;
      screen.put(bx,y-1,'\u250C',C.CYAN,C.BLACK);
      screen.hLine(bx+1,y-1,bw,'\u2500',C.CYAN,C.BLACK);
      screen.put(bx+bw+1,y-1,'\u2510',C.CYAN,C.BLACK);
    }
  }
  if(insideBorder(layout.navY,h)){
    const navPulse=sin(state.time*3)*0.5+0.5;
    screen.putStringCenter(layout.navY,'[ \u2191\u2193 SELECT \u2022 ENTER LAUNCH ]',
      navPulse>0.3?C.BRIGHT_GREEN:C.GREEN,C.BLACK);
  }
}

function renderGameOver(screen,state){
  const w=screen.width,h=screen.height;
  screen.clear(C.BLACK);
  // Starfield background, drawn first so the stats sit on top of it
  drawMenuStars(screen,state,w,h);
  drawBorder(screen,w,h);
  const titleY=floor(h*0.2);
  screen.putStringCenter(titleY,'W A R P   F A I L E D',C.BRIGHT_RED,C.BLACK);
  screen.putStringCenter(titleY+2,'SHIP INTEGRITY COMPROMISED',C.BRIGHT_MAGENTA,C.BLACK);
  const statsY=titleY+5;
  if(state.debugMode==='obstacleCollision'||state.debugMode==='mineCollision'){
    screen.putStringCenter(statsY,`${state.trackerCount}`,C.BRIGHT_MAGENTA,C.BLACK);
    screen.putStringCenter(statsY+2,`Collisions Detected: ${state.trackerCount}`,C.BRIGHT_CYAN,C.BLACK);
    screen.putStringCenter(statsY+3,`Distance: ${(state.distance/10).toFixed(1)} km`,C.BRIGHT_CYAN,C.BLACK);
  }else if(state.debugMode==='chaos'){
    screen.putStringCenter(statsY,`${state.score}`,C.BRIGHT_MAGENTA,C.BLACK);
    screen.putStringCenter(statsY+2,`Total Destruction: ${state.trackerCount}`,C.BRIGHT_CYAN,C.BLACK);
    screen.putStringCenter(statsY+3,`Score: ${state.score}`,C.BRIGHT_CYAN,C.BLACK);
    screen.putStringCenter(statsY+4,`Distance: ${(state.distance/10).toFixed(1)} km`,C.BRIGHT_CYAN,C.BLACK);
  }else{
    screen.putStringCenter(statsY,`${state.score}`,C.BRIGHT_MAGENTA,C.BLACK);
    screen.putStringCenter(statsY+2,`Distance: ${(state.distance/10).toFixed(1)} km`,C.BRIGHT_CYAN,C.BLACK);
    screen.putStringCenter(statsY+3,`Best Score: ${state.bestScore}`,C.BRIGHT_CYAN,C.BLACK);
  }
  // Restart prompt, clamped to the last row inside the border
  const promptY=min(statsY+7,h-2);
  const pulse=sin(state.time*3)*0.5+0.5;
  screen.putStringCenter(promptY,'[ PRESS ENTER TO RELAUNCH ]',
    pulse>0.3?C.BRIGHT_GREEN:C.GREEN,C.BLACK);
}

function drawBorder(screen,w,h){
  screen.put(0,0,'\u2554',C.CYAN,C.BLACK);
  screen.hLine(1,0,w-2,'\u2550',C.CYAN,C.BLACK);
  screen.put(w-1,0,'\u2557',C.CYAN,C.BLACK);
  for(let y=1;y<h-1;y++){
    screen.put(0,y,'\u2551',C.CYAN,C.BLACK);
    screen.put(w-1,y,'\u2551',C.CYAN,C.BLACK);
  }
  screen.put(0,h-1,'\u255A',C.CYAN,C.BLACK);
  screen.hLine(1,h-1,w-2,'\u2550',C.CYAN,C.BLACK);
  screen.put(w-1,h-1,'\u255D',C.CYAN,C.BLACK);
}

function drawMenuStars(screen,state,w,h){
  for(const star of state.stars){
    const sy=star.y%h;
    const y=floor(sy<0?sy+h:sy);
    const x=floor(star.x)%w;
    if(y>0&&y<h-1&&x>0&&x<w-1)
      screen.put(x,y,star.char,star.color,C.BLACK);
  }
}

// ===== Grid fitting =====
// How many cells the window gets, and at what font size.
//
// The grid is the game's whole layout: every screen is written for a terminal
// of at least MIN_WIDTH by MIN_HEIGHT, and the menus, the HUD and the footer
// are placed against that floor. A terminal cannot be smaller than its own
// grid, so the CLI build only has to notice it and say so. A browser window
// can: the canvas is the window, and the grid is whatever the cell size
// divides it into.
//
// Clamping the grid up to the floor - which is what this used to do - builds a
// buffer bigger than the canvas can show and paints the overflow where nothing
// displays it. Measured in a chromium window against the furthest painted
// cell, 500x320 lost 10 columns and 3 rows and 380x240 lost 22 columns and 7
// rows, taking the SHIELD readout off the right of the HUD and the whole
// footer with the control hints and the speed, with nothing on screen saying
// so.
//
// So the font shrinks instead, down to MIN_FONT_SIZE, until the floor fits in
// the window the player actually has. That keeps the promise the CLI build
// makes - 60x20 is the minimum and the whole screen is on it - rather than
// quietly dropping the parts that fell off the edge.

/** The grid every screen in the game is laid out against. */
const MIN_WIDTH=60;
const MIN_HEIGHT=20;
/** The font the grid is drawn at whenever the window has room for it. */
const FONT_SIZE=16;
/** The smallest font the grid is drawn at before the page gives up on it. */
const MIN_FONT_SIZE=6;
/** Leading under each row, which is what makes a cell taller than its font. */
const CELL_LEADING=2;

/** The notice drawn when no font in that range gives the window its grid. */
const TOO_SMALL_TITLE='Window too small!';
const TOO_SMALL_HINT='Please resize your window.';
/** The grid that notice needs: its longest line, and a row either side. */
const NOTICE_COLS=TOO_SMALL_HINT.length;
const NOTICE_ROWS=3;

/**
 * The grid a window of the given pixel size gets.
 *
 * `measure` takes a font size and gives back the cell it draws, which is the
 * one thing here that needs a canvas - so it is passed in, and the fitting
 * itself is arithmetic a test can walk without a DOM.
 *
 * `fits` is false when even MIN_FONT_SIZE cannot reach the floor. The grid
 * that comes back with it is still one the window can show whole, so the
 * notice drawn on it is readable rather than clipped; it is simply smaller
 * than the game can be played on.
 */
function fitGrid(pxW,pxH,measure){
  const at=(fontSize)=>{
    const cell=measure(fontSize);
    return {
      fontSize,cellW:cell.w,cellH:cell.h,
      cols:max(1,floor(pxW/cell.w)),rows:max(1,floor(pxH/cell.h)),
    };
  };
  for(let size=FONT_SIZE;size>=MIN_FONT_SIZE;size--){
    const grid=at(size);
    if(grid.cols>=MIN_WIDTH&&grid.rows>=MIN_HEIGHT)return{...grid,fits:true};
  }
  // No font in the range gives the game its floor, so the window gets the
  // notice instead - at the largest font that still holds the notice, since a
  // message the player cannot read says no more than the blank screen did.
  for(let size=FONT_SIZE;size>=MIN_FONT_SIZE;size--){
    const grid=at(size);
    if(grid.cols>=NOTICE_COLS&&grid.rows>=NOTICE_ROWS)return{...grid,fits:false};
  }
  return {...at(MIN_FONT_SIZE),fits:false};
}

/**
 * What the page draws instead of the game when the window cannot hold the
 * grid: the same three lines the CLI build writes into a terminal too small
 * for it, so the two builds fail the same way in front of the player.
 */
function renderTooSmall(screen){
  const w=screen.width;
  const h=screen.height;
  const mid=floor(h/2);
  screen.clear(C.BLACK);
  screen.putStringCenter(mid-1,TOO_SMALL_TITLE,C.BRIGHT_RED,C.BLACK);
  screen.putStringCenter(mid,`Need ${MIN_WIDTH}x${MIN_HEIGHT}, have ${w}x${h}`,C.WHITE,C.BLACK);
  screen.putStringCenter(mid+1,TOO_SMALL_HINT,C.WHITE,C.BLACK);
}

/**
 * The band at the foot of the viewport the touch overlay anchors to: the
 * footer's own character rows, plus whatever the grid leaves unpainted below
 * them, in pixels.
 *
 * Both halves depend on the font the fit settled on, so no viewport unit can
 * know either - fitGrid floors the row count, so a viewport is almost never a
 * whole number of cells and the remainder sits below the last row. Lifted out
 * of handleResize, which only publishes what this returns, because that
 * function is below the DOM marker and nothing in the suite can execute it.
 */
function footerBandPx(grid,viewportH){
  return viewportH-(grid.rows-FOOTER_ROWS)*grid.cellH;
}

/**
 * The band the game is played in, in pixels: the rows between the HUD at the
 * top and the footer at the bottom. This is the room the touch overlay has to
 * fit in, and the figure the controls are sized against.
 *
 * Published as well as the footer's band because the two answer different
 * questions. --footerpx says where the overlay starts; --playpx says how much
 * of the screen it may take. Sizing the controls in viewport units answered
 * neither: what a control costs is driven by how wide the viewport is, while
 * the room for it is driven by how tall the viewport is, so the two came apart
 * on anything short and wide.
 */
function playBandPx(grid){
  return (grid.rows-HUD_ROWS-FOOTER_ROWS)*grid.cellH;
}

// ===== Touch controls =====
// A phone has no keyboard, so the browser build grows a thumbstick and two
// buttons when it finds itself on one. The stick reading is arithmetic and
// lives here where a test can walk it; the elements, the pointers and the
// reveal are down in the page wiring, which is the part that needs a DOM.

/** Pixels from the stick's centre that count as full deflection. */
const STICK_RADIUS=56;
/** The share of that radius a thumb has to cross before the stick steers. */
const STICK_DEADZONE=0.3;
/**
 * The share of a push that has to fall on one axis for that axis to count.
 *
 * 0.38 is a little under sin(22.5 degrees), so the circle divides into eight
 * even sectors: four straight pushes and four diagonals, with no direction
 * harder to hold than any other.
 */
const STICK_AXIS_SHARE=0.38;

/**
 * A stick reading as the four direction keys it stands for.
 *
 * dx and dy are pixels from the centre of the stick, with dy growing downward
 * as the page measures it while the ship's own y grows upward - that inversion
 * is the one thing here that is not symmetric, and it is why a thumb pushed
 * toward the top of the screen comes back as UP.
 *
 * Two thresholds rather than one. The dead zone decides whether the stick is
 * being pushed at all, so a thumb resting on it does not steer. The axis share
 * then decides which of the eight directions the push is nearest, and drops the
 * smaller half of a diagonal nobody meant to hold - which is what makes a
 * straight push feel straight.
 */
function stickKeys(dx,dy,radius=STICK_RADIUS){
  const out={LEFT:false,RIGHT:false,UP:false,DOWN:false};
  const dist=sqrt(dx*dx+dy*dy);
  if(dist<radius*STICK_DEADZONE)return out;
  if(abs(dx)>=dist*STICK_AXIS_SHARE){
    if(dx<0)out.LEFT=true;else out.RIGHT=true;
  }
  if(abs(dy)>=dist*STICK_AXIS_SHARE){
    if(dy<0)out.UP=true;else out.DOWN=true;
  }
  return out;
}

/**
 * What the FIRE button sends in a given mode.
 *
 * A phone has no ENTER either, and the title screen, the debug menu and the
 * game over screen all wait on one. The button is the trigger during a run and
 * the confirm key everywhere else, which is the reading a player already has of
 * the biggest button on the screen.
 */
function touchFireKey(mode){
  return mode==='playing'?'SPACE':'ENTER';
}

// ===== Sound (Web Audio) =====
// Every cue is synthesized on the spot: there are no audio files to fetch, so
// nothing to load before a run and nothing to keep in step with the build.

// The one-shot cues, each a frequency sweep under a decaying envelope. The shot
// and the mine sweep down, the orb chimes up, and damage is the lowest and
// longest of the four so it reads as a hit rather than as another pickup.
const SOUND_CUES={
  shot:  {wave:'square',  from:900,to:180, dur:0.10,gain:0.05},
  orb:   {wave:'sine',    from:660,to:1400,dur:0.18,gain:0.06},
  damage:{wave:'sawtooth',from:220,to:50,  dur:0.30,gain:0.09},
  mine:  {wave:'square',  from:180,to:28,  dur:0.45,gain:0.10},
  // A powerup sweeps up further and longer than the orb does, and on a
  // triangle rather than a sine, so the two pickups are told apart by ear:
  // an orb is a tick and a powerup is a rising chime.
  powerup:{wave:'triangle',from:520,to:1760,dur:0.28,gain:0.07},
};

// The engine hum. Its pitch is this note times the speed readout the HUD shows,
// so what is heard and what is read move together and a boost is audible.
const ENGINE_BASE_HZ=55;
const ENGINE_GAIN=0.03;

class RetroAudio{
  constructor(makeContext){
    this.makeContext=makeContext;
    this.ctx=null;
    this.engine=null;
    this.failed=false;
  }
  // The context is built on the first cue rather than at startup, and only once:
  // a browser that refuses one outright leaves the game silent instead of
  // throwing every frame.
  context(){
    if(this.ctx||this.failed)return this.ctx;
    try{this.ctx=this.makeContext()}catch(e){this.failed=true}
    return this.ctx;
  }
  // The context, but only when it is actually running, which is the only state
  // worth scheduling against. A browser that will not start one before the page
  // has been touched hands back a suspended context, and a suspended context's
  // clock sits at 0: everything play() schedules reads that clock, so every cue
  // raised beforehand would be scheduled for the same instant at full gain and
  // the whole backlog would sound together the moment the context woke - which
  // is what a `?mode=` link, whose run is under way before anything has been
  // pressed, used to open with. Those cues were never going to be audible, so
  // they are dropped here instead of queued.
  //
  // Reading the state rather than waiting for the keypress is what keeps a
  // browser that allows the sound outright - a high Media Engagement Index, or
  // the site given Sound: Allow - playing the run from its first frame. It hands
  // back a context already running, on a clock that advances, and there is
  // nothing for a gesture to add.
  live(){
    const ctx=this.context();
    return ctx&&ctx.state==='running'?ctx:null;
  }
  // The page's first keypress, from the keydown handler: the gesture a blocked
  // browser is waiting for. Harmless on a context already running, and on a
  // browser that has no context to give.
  resume(){
    const ctx=this.context();
    if(ctx&&ctx.state==='suspended'&&ctx.resume)ctx.resume();
  }
  play(name){
    const spec=SOUND_CUES[name];
    if(!spec)return;
    const ctx=this.live();
    if(!ctx)return;
    const t=ctx.currentTime;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type=spec.wave;
    osc.frequency.setValueAtTime(spec.from,t);
    osc.frequency.exponentialRampToValueAtTime(spec.to,t+spec.dur);
    gain.gain.setValueAtTime(spec.gain,t);
    // Ramping to silence rather than stopping on a live gain is what keeps the
    // tail off; an exponential ramp cannot reach zero, so it lands just under.
    gain.gain.exponentialRampToValueAtTime(0.0001,t+spec.dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t+spec.dur);
  }
  // The hum runs for as long as the run does. Starting and stopping it every
  // frame would click, so it is held open and only its frequency moves.
  engineOn(speedMultiple){
    const ctx=this.live();
    if(!ctx)return;
    if(!this.engine){
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='triangle';
      gain.gain.setValueAtTime(ENGINE_GAIN,ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      this.engine={osc,gain};
    }
    this.engine.osc.frequency.setValueAtTime(ENGINE_BASE_HZ*speedMultiple,ctx.currentTime);
  }
  engineOff(){
    if(!this.engine)return;
    this.engine.osc.stop(this.ctx.currentTime);
    this.engine.osc.disconnect();
    this.engine.gain.disconnect();
    this.engine=null;
  }
  // Play out one frame: the cues the engine queued, then the hum, which runs
  // only while a run is actually advancing. Mute silences all of it.
  frame(state){
    if(state.muted){this.engineOff();return}
    for(const cue of state.sounds)this.play(cue);
    if(state.mode==='playing'&&!state.paused)this.engineOn(state.speed/BASE_SPEED_START);
    else this.engineOff();
  }
}

// ===== Canvas Setup & Sizing =====
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const fontOf=(size)=>`${size}px 'Courier New', 'Consolas', monospace`;

/** The cell a given font size draws, measured off the canvas it is drawn on. */
function measureCell(size){
  ctx.font=fontOf(size);
  return {w:max(1,ceil(ctx.measureText('M').width)),h:size+CELL_LEADING};
}

let FONT=fontOf(FONT_SIZE);
let cellW,cellH;
let termWidth,termHeight;
/** Whether the window can hold the grid the game is laid out for. */
let gridFits=true;
let screen;
const game=new Game();

function handleResize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const grid=fitGrid(canvas.width,canvas.height,measureCell);
  FONT=fontOf(grid.fontSize);
  cellW=grid.cellW;
  cellH=grid.cellH;
  gridFits=grid.fits;
  termWidth=grid.cols;
  termHeight=grid.rows;
  screen=new ScreenBuffer(termWidth,termHeight);
  game.initStars(termWidth,termHeight);
  game.state.screenWidth=termWidth;
  game.state.screenHeight=termHeight;
  // What the touch overlay anchors to. The figure itself is footerBandPx,
  // above the DOM marker where the suite can reach it; this line only hands
  // it to the CSS, which cannot work it out in viewport units.
  const root=document.documentElement.style;
  root.setProperty('--footerpx',footerBandPx(grid,canvas.height)+'px');
  root.setProperty('--playpx',playBandPx(grid)+'px');
}

window.addEventListener('resize',handleResize);
handleResize();

// ===== System colour scheme =====
// Followed rather than offered: the page asks the system what it wants and
// repaints when the answer changes, so a desktop switching to light at sunset
// takes the game with it mid-run. There is no key for it, because it is not a
// preference about the game - the CRT overlay on C is.
const lightQuery=window.matchMedia('(prefers-color-scheme: light)');
let scheme=lightQuery.matches?'light':'dark';

function applyTheme(){
  PALETTE=themePalette(scheme);
  document.body.classList.toggle('light',scheme==='light');
}
applyTheme();
lightQuery.addEventListener('change',(e)=>{
  scheme=e.matches?'light':'dark';
  applyTheme();
});

// ===== CRT overlay and sound, wired to the page =====
let crtOn=loadCrt();

function applyCrt(){document.body.classList.toggle('crt',crtOn)}
applyCrt();

const audio=new RetroAudio(()=>new (window.AudioContext||window.webkitAudioContext)());

// ===== URL params for debug =====
const params=new URLSearchParams(window.location.search);
const wantsDebug=params.has('debug');
const explicitMode=params.get('mode');
if(explicitMode){
  const validModes=['mines','orbs','obstacleCollision','mineCollision','chaos'];
  if(validModes.includes(explicitMode))game.startGame(explicitMode);
}else if(wantsDebug){
  game.showDebugMenu();
}

// ===== Input handling =====
const keys={};
const justPressed={};

function mapKey(e){
  switch(e.code){
    case'ArrowUp':return'UP';case'ArrowDown':return'DOWN';
    case'ArrowLeft':return'LEFT';case'ArrowRight':return'RIGHT';
    case'KeyW':return'W';case'KeyA':return'A';case'KeyS':return'S';case'KeyD':return'D';
    case'KeyQ':return'Q';case'KeyE':return'E';case'KeyF':return'F';
    case'KeyP':return'P';case'KeyM':return'M';case'KeyC':return'C';
    case'Space':return'SPACE';case'Enter':return'ENTER';
    case'Escape':return'ESCAPE';case'Tab':return'TAB';
    case'ShiftLeft':case'ShiftRight':return'SHIFT';
    case'Digit1':return'DIGIT_1';case'Digit2':return'DIGIT_2';
    case'Digit3':return'DIGIT_3';case'Digit4':return'DIGIT_4';
    case'Digit5':return'DIGIT_5';
    default:return null;
  }
}

window.addEventListener('keydown',e=>{
  const k=mapKey(e);
  if(k){
    e.preventDefault();
    audio.resume();
    if(!keys[k])justPressed[k]=true;
    keys[k]=true;
  }
});
window.addEventListener('keyup',e=>{
  const k=mapKey(e);
  if(k){e.preventDefault();keys[k]=false}
});

// ===== Touch controls, wired to the page =====
// The on-screen stick and buttons feed the same two maps the keyboard does, so
// nothing downstream knows or cares which one a run is being played on.

const touchLayer=document.getElementById('touch');
const stickEl=document.getElementById('stick');
const nubEl=document.getElementById('nub');
const fireEl=document.getElementById('fire');
const boostEl=document.getElementById('boost');

/** Press or release a key exactly as the keydown handler does. */
function setKey(k,down){
  if(down){
    if(!keys[k])justPressed[k]=true;
    keys[k]=true;
  }else{
    keys[k]=false;
  }
}

/**
 * Show the controls the first time a touch arrives, and never before.
 *
 * Capability is the wrong question: a laptop with a touchscreen reports touch
 * support and is nearly always being driven by its keyboard, and a thumbstick
 * parked over the tunnel there is worse than none at all. An actual touch is
 * the answer to the right question, and it costs one frame of the first tap.
 */
let touchShown=false;
function revealTouch(){
  if(touchShown)return;
  touchShown=true;
  touchLayer.hidden=false;
}
window.addEventListener('touchstart',revealTouch,{passive:true});

// The stick. One pointer owns it at a time, tracked by id so a thumb on the
// stick and a thumb on FIRE do not take each other's events - which is most of
// what playing with two thumbs is.
let stickPointer=null;
const STICK_KEYS=['LEFT','RIGHT','UP','DOWN'];

function releaseStick(){
  stickPointer=null;
  for(const k of STICK_KEYS)setKey(k,false);
  nubEl.style.transform='translate(0,0)';
  stickEl.classList.remove('on');
}

function driveStick(e){
  const box=stickEl.getBoundingClientRect();
  const radius=box.width/2;
  const dx=e.clientX-(box.left+radius);
  const dy=e.clientY-(box.top+radius);
  const held=stickKeys(dx,dy,radius);
  for(const k of STICK_KEYS)setKey(k,held[k]);
  // The nub follows the thumb as far as the ring and no further, so the
  // control shows what it is reporting.
  const dist=sqrt(dx*dx+dy*dy);
  const cap=dist>radius?radius/dist:1;
  nubEl.style.transform=`translate(${dx*cap}px,${dy*cap}px)`;
}

stickEl.addEventListener('pointerdown',e=>{
  e.preventDefault();
  revealTouch();
  audio.resume();
  stickPointer=e.pointerId;
  stickEl.setPointerCapture(e.pointerId);
  stickEl.classList.add('on');
  driveStick(e);
});
stickEl.addEventListener('pointermove',e=>{
  if(e.pointerId!==stickPointer)return;
  e.preventDefault();
  driveStick(e);
});
for(const type of ['pointerup','pointercancel','pointerleave']){
  stickEl.addEventListener(type,e=>{
    if(e.pointerId!==stickPointer)return;
    e.preventDefault();
    releaseStick();
  });
}

/**
 * A button that holds a key down for as long as it is held.
 *
 * `resolve` is called once, on the press, and the key it names is the key the
 * release lets go of. FIRE reads the mode to decide, and a run that ends under
 * the player's thumb would otherwise leave SPACE stuck down while ENTER was
 * what got released.
 */
function holdButton(el,resolve){
  let pointerId=null;
  let held=null;
  const release=()=>{
    if(held!==null)setKey(held,false);
    held=null;
    pointerId=null;
    el.classList.remove('on');
  };
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    revealTouch();
    audio.resume();
    pointerId=e.pointerId;
    el.setPointerCapture(e.pointerId);
    el.classList.add('on');
    held=resolve();
    setKey(held,true);
  });
  for(const type of ['pointerup','pointercancel','pointerleave']){
    el.addEventListener(type,e=>{
      if(e.pointerId!==pointerId)return;
      e.preventDefault();
      release();
    });
  }
}

holdButton(fireEl,()=>touchFireKey(game.state.mode));
holdButton(boostEl,()=>'F');

// ===== Main loop =====
let lastTime=performance.now();
const TARGET_FPS=30;
const FRAME_MS=1000/TARGET_FPS;
let accumulator=0;

function frame(now){
  requestAnimationFrame(frame);
  const elapsed=now-lastTime;
  lastTime=now;
  accumulator+=elapsed;
  if(accumulator<FRAME_MS)return;
  accumulator-=FRAME_MS;
  if(accumulator>FRAME_MS*2)accumulator=0; // prevent spiral

  const dt=min(FRAME_MS/1000,0.05);

  // The window cannot hold the grid even at the smallest font, so it gets the
  // notice and nothing else - as the CLI build does in a terminal too small
  // for it. The run is left exactly where it stood: resizing back brings the
  // same game up rather than a fresh one.
  //
  // The hum is cut on the way out. RetroAudio.frame is what normally stops it,
  // and this returns before reaching it, so without the call here a run shrunk
  // below the floor would drone on at the pitch it was last set to for as long
  // as the notice was up - the run is not advancing, which is the one condition
  // the hum runs under. The cues need no such handling: update clears the queue
  // at the top of every frame, so the frame that resumes plays its own.
  if(!gridFits){
    audio.engineOff();
    ctx.fillStyle=THEME_BG[scheme];
    ctx.fillRect(0,0,canvas.width,canvas.height);
    renderTooSmall(screen);
    screen.render(ctx,cellW,cellH,FONT);
    for(const k of Object.keys(justPressed))delete justPressed[k];
    return;
  }

  // Handle menu input
  game.handleMenuInput(justPressed);

  // C toggles the CRT overlay. It is a property of the page rather than of the
  // game, so it lives here beside the element it drives, and the choice is
  // written through so a refresh comes back the way the player left it.
  if(justPressed.C){
    crtOn=!crtOn;
    saveCrt(crtOn);
    applyCrt();
  }

  // ESC
  if(justPressed.ESCAPE){
    if(game.state.mode==='playing'||game.state.mode==='dead'||game.state.mode==='debugMenu'){
      game.state.mode='menu';
    }
  }

  // Update
  game.update(dt,keys,justPressed);

  // Play out the frame the engine just simulated. It names the events; what
  // they sound like is the audio layer's business.
  audio.frame(game.state);

  // Clear canvas, in the page's own colour so a light scheme does not leave a
  // black frame around the grid.
  ctx.fillStyle=THEME_BG[scheme];
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Render to screen buffer
  switch(game.state.mode){
    case'menu':renderTitleScreen(screen,game.state);break;
    case'debugMenu':renderDebugMenu(screen,game.state);break;
    case'playing':renderGame(screen,game.state);break;
    case'dead':renderGameOver(screen,game.state);break;
  }

  // Flush screen buffer to canvas, jolted by the damage shake. Translating the
  // whole grid leaves black at the edges, which is the shake reading as impact.
  const shake=shakeOffset(game.state);
  ctx.save();
  ctx.translate(shake.x,shake.y);
  screen.render(ctx,cellW,cellH,FONT);
  ctx.restore();

  // Clear justPressed
  for(const k of Object.keys(justPressed))delete justPressed[k];
}

requestAnimationFrame(frame);
</script>
</body>
</html>
