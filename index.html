<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Space Rider</title>
<!-- The ship icon from icon.svg, inlined as a data URI so the tab shows it
     without a second request and the page stays one file. Rebuild it from that
     file rather than editing the URI by hand: strip its comment and title,
     collapse the whitespace, single-quote the attributes, and percent-encode
     the angle brackets and every #. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' role='img' aria-label='Space Rider'%3E %3Crect width='32' height='32' fill='%23000000'/%3E %3Cpath d='M16 3 21 14 11 14Z' fill='%2355ffff'/%3E %3Crect x='13' y='14' width='6' height='9' fill='%2355ffff'/%3E %3Cpath d='M11 15 3 21 11 21Z' fill='%235555ff'/%3E %3Cpath d='M21 15 29 21 21 21Z' fill='%235555ff'/%3E %3Crect x='8' y='23' width='4' height='6' fill='%2300aaaa'/%3E %3Crect x='20' y='23' width='4' height='6' fill='%2300aaaa'/%3E %3C/svg%3E"/>
<meta name="color-scheme" content="dark light"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
/* Light mode. The game is a neon tunnel on black and that is its natural
   state, so dark is the default and stays the default when the system says
   nothing. A system set to a light appearance gets the page re-lit rather than
   a black rectangle in the middle of a white desktop: this repaints the page
   under the canvas, and themePalette re-inks the characters drawn on it. */
body.light{background:#f2f2f4}
canvas{display:block}
/* CRT overlay: scanlines and a vignette laid over the canvas rather than drawn
   into the character grid, because it is a property of the screen the game is
   shown on and not of the game. Never under the pointer, and toggled by the
   `crt` class on the body so the whole effect is one class away. */
#crt{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;opacity:0;transition:opacity .15s linear;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.26) 0,rgba(0,0,0,.26) 1px,
      rgba(0,0,0,0) 1px,rgba(0,0,0,0) 3px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);
}
body.crt #crt{opacity:1}
/* On-screen controls for a touch device. Hidden until a touch actually
   happens - a laptop with a touchscreen is nearly always being driven by its
   keyboard, and a thumbstick parked over the tunnel on every desktop is worse
   than no thumbstick at all. The page reveals them on the first touchstart and
   then leaves them up.

   touch-action:none on the whole overlay is what stops a drag on the stick
   scrolling or zooming the page out from under the run. */
#touch{
  position:fixed;left:0;top:0;width:100%;height:100%;
  pointer-events:none;touch-action:none;
  font:600 13px/1 'Courier New','Consolas',monospace;
  -webkit-user-select:none;user-select:none;
}
#touch[hidden]{display:none}
/* How big the controls are drawn, declared once here because two rules read
   each figure: --ctl is both FIRE's size and the height BOOST's offset stands
   on, and writing that offset as a second copy of the size is what put BOOST
   on the HUD the first time.

   Three caps, because three different things bound a control. A share of the
   screen wide enough for a thumb. A pixel ceiling, past which it is not worth
   drawing any larger. And the room actually available, which is the one that
   was missing: what the controls cost - for FIRE and BOOST, two of them and
   the 2vw gap between them - was driven by how wide the viewport is, while the
   room for them is driven by how tall it is, so on anything short and wide
   they outgrew the playable band and BOOST climbed back onto the shield bar.

   No viewport unit can bound that. The band is a whole number of character
   rows at whatever font the fitter settled on, so handleResize publishes it as
   --playpx and each size is solved out of it: whatever is left of the band
   once the 1vh offset and the gap are taken, shared between however many
   controls stand in it.

   The 8px is clearance. Solved exactly, the top edge lands on the HUD's bottom
   edge and sub-pixel rounding decides which side of it the first row falls;
   8px is a little under half a character row at the default font, so the
   control clears the shield bar rather than touching it. The fallbacks are
   what these resolve to if the property never arrives, and they are
   deliberately large: the two viewport caps then win and the controls lay out
   as they always did, rather than collapsing to nothing. */
:root{
  --ctl:min(24vw,118px,calc((var(--playpx,9999px) - 1vh - 2vw - 8px) / 2));
  --stick:min(34vw,170px,calc(var(--playpx,9999px) - 1vh - 8px));
}
#stick,#fire,#boost{
  position:absolute;pointer-events:auto;touch-action:none;
  border:2px solid rgba(85,255,255,.55);background:rgba(0,32,40,.35);
  color:#55ffff;display:flex;align-items:center;justify-content:center;
}
/* The bottom offset is the footer's own band rather than a vh constant. The
   footer is FOOTER_ROWS character rows tall, and how tall a row is depends
   on the font the fitter settled on, so no viewport unit can know it -
   handleResize measures it and publishes --footerpx for these rules. On a
   phone held in landscape a 6vh offset was under two rows, and the stick and
   FIRE covered the status strip carrying SPD, the badges and MUTED. */
#stick{left:5vw;bottom:calc(var(--footerpx,36px) + 1vh);
  width:var(--stick);aspect-ratio:1;border-radius:50%}
#nub{
  width:38%;height:38%;border-radius:50%;
  background:rgba(85,255,255,.45);
  /* Centred by the flex parent, then offset by the live reading. */
  transform:translate(0,0);
}
#fire,#boost{right:5vw;width:var(--ctl);aspect-ratio:1;border-radius:50%}
#fire{bottom:calc(var(--footerpx,36px) + 1vh)}
/* BOOST stands on FIRE's real height plus a 2vw gap - the same --ctl, not a
   restatement of it. The offset used to be 26vw, FIRE's width plus the gap,
   which tracked the height only while it was still 24vw: past a viewport of
   about 492px the offset kept growing, the height did not, and BOOST drifted
   off towards the top right corner and onto the HUD. */
#boost{bottom:calc(var(--footerpx,36px) + 1vh + var(--ctl) + 2vw);
  border-color:rgba(255,85,255,.55);color:#ff55ff;background:rgba(40,0,40,.35)}
#stick.on,#fire.on,#boost.on{background:rgba(85,255,255,.3);border-color:#55ffff}
#boost.on{background:rgba(255,85,255,.3);border-color:#ff55ff}
/* The same controls re-inked for a light page, on the palette's own darker
   cyan and magenta so they read against white rather than glowing on it. */
body.light #stick,body.light #fire{
  border-color:rgba(0,90,100,.6);background:rgba(0,90,100,.12);color:#005a64}
body.light #nub{background:rgba(0,90,100,.5)}
body.light #boost{
  border-color:rgba(140,20,130,.6);background:rgba(140,20,130,.12);color:#8c1482}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crt"></div>
<div id="touch" hidden>
  <div id="stick"><div id="nub"></div></div>
  <div id="fire">FIRE</div>
  <div id="boost">BOOST</div>
</div>
<script>
// CMD Space Rider — Browser terminal preview
// Faithful port of the CLI game rendered as a canvas-based character grid

const {PI,sin,cos,sqrt,abs,max,min,floor,ceil,round,atan2}=Math;
const TAU=PI*2;

// The engine's source of randomness, and the one place it can be pinned.
// Every draw this build makes comes through RNG.next, so seeding it seeds
// the whole run: the obstacle and orb field startGame opens with, the mine
// timers, the starfield, the debris a burst is thrown in. Unseeded it is
// Math.random, which is what the game plays on.
//
// mulberry32, restated here exactly as src/types.ts states it - only imul
// and shifts, so both builds step the same 32-bit arithmetic and draw the
// same sequence from the same seed. test/parity.test.mjs pins that.
function seededRandom(seed){
  let a=seed>>>0;
  return ()=>{
    a=(a+0x6D2B79F5)>>>0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
const RNG={next:Math.random};
function seedRng(seed){RNG.next=seed===null?Math.random:seededRandom(seed);}
const random=()=>RNG.next();
const rand=(a=0,b=1)=>a+random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>max(lo,min(hi,v));

// ===== ANSI 256 color palette → hex =====
const ANSI256 = (function(){
  const c = new Array(256);
  // Standard 16 colors (approximate xterm defaults)
  const base16 = [
    '#000000','#aa0000','#00aa00','#aa5500',
    '#0000aa','#aa00aa','#00aaaa','#aaaaaa',
    '#555555','#ff5555','#55ff55','#ffff55',
    '#5555ff','#ff55ff','#55ffff','#ffffff',
  ];
  for(let i=0;i<16;i++) c[i]=base16[i];
  // 216-color cube (indices 16-231)
  const vals=[0,0x5f,0x87,0xaf,0xd7,0xff];
  for(let i=0;i<216;i++){
    const r=vals[floor(i/36)];
    const g=vals[floor(i/6)%6];
    const b=vals[i%6];
    c[16+i]='#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
  }
  // Grayscale ramp (indices 232-255)
  for(let i=0;i<24;i++){
    const v=8+i*10;
    c[232+i]='#'+(v<<16|v<<8|v).toString(16).padStart(6,'0');
  }
  return c;
})();

// Color constants (matching types.ts)
const C={
  BLACK:0,RED:1,GREEN:2,YELLOW:3,BLUE:4,MAGENTA:5,CYAN:6,WHITE:7,
  GRAY:8,BRIGHT_RED:9,BRIGHT_GREEN:10,BRIGHT_YELLOW:11,
  BRIGHT_BLUE:12,BRIGHT_MAGENTA:13,BRIGHT_CYAN:14,BRIGHT_WHITE:15,
  DARK_BLUE:17,DARK_CYAN:23,DARK_GREEN:22,
  NEON_CYAN:51,NEON_GREEN:46,NEON_MAGENTA:201,NEON_RED:196,ORANGE:208,
};

// ===== Theme (prefers-color-scheme) =====
// The game is a neon tunnel on black. That is what a terminal looks like, and
// it is what every colour above was picked against, so dark is the default and
// stays the default when the system says nothing at all.
//
// Light mode is the same drawing re-inked rather than a second renderer. Every
// glyph the game lays down carries an ANSI index, so swapping what those
// indices resolve to changes the whole screen at once and no drawing code has
// to know which scheme is up. Nothing here touches the game: a run looks
// different and plays identically.
//
// Only the indices the game actually draws with are re-inked. The 216-colour
// cube and the grey ramp behind them are left as xterm defines them, since
// nothing reaches for one by number.
const LIGHT_INK={
  // BLACK is the page under everything, so in light mode it is the paper.
  0:'#f2f2f4',
  // The greys and whites invert: what was the brightest ink is now the darkest.
  7:'#4a4a52',8:'#8a8a94',15:'#101014',
  // The tunnel: blue at the far end, cyan at the mouth, both taken down far
  // enough to read as walls against paper rather than as glare on it.
  4:'#1b2478',12:'#2f3fc8',17:'#0d1240',6:'#00565f',14:'#00757f',23:'#0a444c',
  // Orbs and the shield bar.
  2:'#0a6a22',10:'#0a8a2c',22:'#064a16',
  // Obstacles, mines and the damage flash.
  1:'#8f1212',9:'#c11a1a',
  // The distance readout, the roll wings and the boost lines.
  5:'#6b0f63',13:'#a81a9a',
  // The pause label and the mute indicator.
  3:'#6e5600',11:'#8f7300',
  // The named neons, each to the same value as the base colour it echoes.
  51:'#00707a',46:'#0a7a24',201:'#a3129a',196:'#c01414',208:'#a35a00',
};

// The page colour each scheme paints behind the character grid. The renderer
// leaves a cell whose background is BLACK unpainted, so this is what shows
// through the whole tunnel.
const THEME_BG={dark:'#000000',light:'#f2f2f4'};

// The 256 colours a scheme resolves to. Dark is the base palette itself, which
// is what makes dark mode exactly what it always was rather than a theme that
// happens to match.
function themePalette(scheme){
  if(scheme!=='light')return ANSI256;
  const out=ANSI256.slice();
  for(const index of Object.keys(LIGHT_INK))out[index]=LIGHT_INK[index];
  return out;
}

// The palette ScreenBuffer.render draws through, swapped by applyTheme down in
// the page wiring. It is a binding rather than a lookup at each cell because
// render is the innermost loop in the program.
let PALETTE=ANSI256;

// ===== ScreenBuffer (canvas-backed) =====
class ScreenBuffer{
  constructor(w,h){this.resize(w,h)}
  resize(w,h){
    this.width=w;this.height=h;
    const sz=w*h;
    this.chars=new Array(sz).fill(' ');
    this.fg=new Array(sz).fill(7);
    this.bg=new Array(sz).fill(0);
  }
  clear(bgColor=0){this.chars.fill(' ');this.fg.fill(7);this.bg.fill(bgColor)}
  put(x,y,ch,fgColor=7,bgColor=0){
    x=floor(x);y=floor(y);
    if(x<0||x>=this.width||y<0||y>=this.height)return;
    const i=y*this.width+x;
    this.chars[i]=ch;this.fg[i]=fgColor;this.bg[i]=bgColor;
  }
  putString(x,y,str,fgColor=7,bgColor=0){
    for(let i=0;i<str.length;i++)this.put(x+i,y,str[i],fgColor,bgColor);
  }
  putStringCenter(y,str,fgColor=7,bgColor=0){
    const x=floor((this.width-str.length)/2);
    this.putString(x,y,str,fgColor,bgColor);
  }
  fillRect(x,y,w,h,ch,fgColor,bgColor){
    for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)this.put(x+dx,y+dy,ch,fgColor,bgColor);
  }
  hLine(x,y,len,ch,fgColor,bgColor=0){
    for(let i=0;i<len;i++)this.put(x+i,y,ch,fgColor,bgColor);
  }
  vLine(x,y,len,ch,fgColor,bgColor=0){
    for(let i=0;i<len;i++)this.put(x,y+i,ch,fgColor,bgColor);
  }
  render(ctx,cellW,cellH,font){
    ctx.textBaseline='top';
    ctx.font=font;
    for(let y=0;y<this.height;y++){
      for(let x=0;x<this.width;x++){
        const i=y*this.width+x;
        const px=x*cellW;
        const py=y*cellH;
        // Background
        const bgHex=PALETTE[this.bg[i]]||'#000000';
        if(this.bg[i]!==0){
          ctx.fillStyle=bgHex;
          ctx.fillRect(px,py,cellW+1,cellH+1);
        }
        // Character
        const ch=this.chars[i];
        if(ch!==' '){
          ctx.fillStyle=PALETTE[this.fg[i]]||'#aaaaaa';
          ctx.fillText(ch,px,py);
        }
      }
    }
  }
}

// ===== Game Constants =====
const NUM_RINGS=30;
const RECYCLE_Z=NUM_RINGS*14;
const HUD_ROWS=3;
const FOOTER_ROWS=2;
const Y_FACTOR=0.4;
const SHIP_HALF_W=1;
const SHIP_HALF_H=1;
// The furthest the hit test's sweep lets a shot and its target close on each
// other between two samples, in world units.
//
// The contact it looks for is a pair of cells meeting on the screen, and a cell
// is worth well under a unit of depth at the ranges a shot is taken at, so a
// frame tested only at its ends can step a tracer clean over a block and never
// know. Three quarters of a unit keeps every sample inside a cell at thirty
// frames a second and still holds at a sixth of a second a frame, which is
// slower than anything the game runs at.
const SWEEP_STEP=0.75;

// Speed a run starts at. The HUD speed readout is a multiple of this.
const BASE_SPEED_START=0.3;
// Seconds the screen shake lasts after the ship takes damage.
const SHAKE_TIME=0.2;
// Seconds the "NEW BEST" HUD banner stays on screen.
const NEW_BEST_FLASH_TIME=2;
// Peak canvas offset of the damage shake, in pixels.
const SHAKE_PIXELS=5;
// Seconds a barrel roll takes to carry the ship all the way round.
const ROLL_TIME=0.5;
// Seconds from the start of one barrel roll to the earliest next one. Longer
// than the roll itself, so there is a beat of level flight between two of them
// and the invincibility the roll grants cannot be held open indefinitely.
const ROLL_COOLDOWN=1.2;
// Columns of slack the pulse cannon's hit test allows either side of a target's
// drawn block, at the 80-column grid every figure in this repository was first
// measured on. shotSlackCols below is what the hit test reads.
//
// Past about 47 units out a target's block is a single character, so without
// slack a shot has to land on one exact column. Two things go wrong with that.
// Both positions are floored to a cell, so a shot dead on in world terms still
// reads as one column adrift whenever the two fall either side of a cell
// boundary. And a target's own column creeps outward while the shot is in
// flight, which over a long one comes to about a column of lead the player has
// no way to measure.
//
// One column covers both at 80 wide: the shot registers where it passes through
// the target's block or immediately beside it. Two was measured as well and buys
// little past what the three-shot volley's own spread already covers, at the
// cost of counting a shot that visibly clears the target by a character.
const SHOT_SLACK_COLS=1;
// The grid width SHOT_SLACK_COLS was measured at.
const SLACK_REF_WIDTH=80;
// The slack that constant is worth at the grid actually being played.
//
// Both of the faults it answers are measured in columns and both grow with the
// grid. A target's outward creep over a long flight scales with colRange, which
// is 37 columns at 80 wide and 99.5 at 205, so the same flight that ends a
// column out at 80 ends nearly three columns out on a full-screen browser
// window. A fixed column of slack is therefore a wide slack on a narrow screen
// and no slack at all on a wide one, and the long band fell from 98% to 83%
// across exactly that change of grid.
//
// Scaling it by colRange holds the slack at a constant share of the tunnel's
// width instead, which is the thing the creep is a share of. It never falls
// below the one column a narrow grid needs for the flooring alone.
function shotSlackCols(screenWidth){
  const scaled=SHOT_SLACK_COLS*((screenWidth-6)/(SLACK_REF_WIDTH-6));
  return max(SHOT_SLACK_COLS,round(scaled));
}
// The two columns the tunnel's walls are drawn on for a given row.
//
// Three things read it, and that is why it sits here with the tuning constants
// rather than down in the rendering section: drawTunnel lays the walls down from
// it, drawBullets reads it back to decide whether a tracer is still inside the
// corridor, and the pulse cannon's hit test reads it to decide whether that
// tracer was drawn at all. The corridor the player sees, the corridor a shot is
// drawn in and the corridor a shot can register in are then one corridor and
// cannot drift apart.
function tunnelSpan(row,gameTop,gameBottom,w){
  const center=floor(w/2);
  const t=(row-gameTop)/(gameBottom-gameTop);
  const halfSpan=floor(3+t*(center-4));
  return {left:center-halfSpan,right:center+halfSpan};
}

// Whether a tracer at this column and row is inside the corridor, which is what
// drawBullets draws it in.
//
// The corridor is what the walls enclose and not the walls themselves:
// drawTunnel lays its glyph on tunnelSpan's own two columns and thickens outward
// from there, so the corridor runs from left + 1 to right - 1.
function tracerLit(col,row,gameTop,gameBottom,w){
  const span=tunnelSpan(row,gameTop,gameBottom,w);
  return col>span.left&&col<span.right;
}

// Seconds a combo chain survives without a kill before it drops to nothing.
const COMBO_TIME=2;
// The highest multiplier a chain can reach. Without a ceiling the chain barely
// ever breaks - obstacle density rises with difficulty, so two seconds is longer
// than the gap between kills - and an ordinary run runs into the millions while a
// best score set by one long chain is one ordinary play can never approach again.
// The counter reads the cap rather than counting past it, so the number on the
// HUD is always the multiplier actually being paid. Eight clears the top HUD
// colour tier at 6, so every tier is still reachable, and holds a mine kill at
// 4000 rather than the 68,600 the 343rd kill of an uncapped chain was worth.
const COMBO_MAX=8;

// Seconds of game time between one difficulty step and the next.
//
// updateObstacleScaling has counted in whole minutes since it was written - it
// thickens the field every time floor(gameTime / 60) moves on - and the warp
// transition is that same crossing made visible. Naming the number once is what
// keeps the effect on the step it announces: a warp flash a few seconds out from
// the obstacles arriving would read as a second event.
const WARP_INTERVAL=60;
// Seconds the warp transition runs for: the banner in the HUD, the shifted
// tunnel walls, and the denser speed lines down both margins. Two seconds is the
// NEW_BEST_FLASH_TIME the other HUD banner already uses, which is long enough to
// read a three-word line and short enough that the walls are back to their own
// colours well before the thickened field reaches the ship.
const WARP_FLASH_TIME=2;

// The chance a mine shot to pieces leaves a powerup behind.
//
// Only a kill drops one. Ramming a mine destroys it too, but that is the player
// taking 35 shield for it, and paying a reward out for the collision would
// undercut the one move the mine is there to punish.
const POWERUP_DROP_CHANCE=0.35;
// Units a second a dropped powerup closes on the ship while it drifts in.
const POWERUP_DRIFT=2.5;
// Shield a Shield Regen pickup restores, capped at the usual 100.
const POWERUP_SHIELD_GAIN=25;
// Seconds a Rapid Fire pickup holds the cannon at its faster cadence.
const RAPID_FIRE_TIME=10;
// Seconds a Slow Motion pickup holds the world at half speed.
const SLOW_MOTION_TIME=5;
// What Slow Motion multiplies the world's clock by while it runs.
const SLOW_MOTION_SCALE=0.5;
// The cannon's nominal cadence, in seconds between volleys.
//
// Tapping the trigger is not gated by it - a press has always fired at once and
// still does, because a cannon that swallows a keypress reads as a broken one.
// It is the rate Rapid Fire holds the trigger down at, and the figure the "3x"
// on the pickup is three times of.
const FIRE_INTERVAL=0.36;
// How much faster Rapid Fire makes that cadence.
const RAPID_FIRE_MULT=3;
// Seconds between two volleys with Rapid Fire running and SPACE held. It comes
// out at the 0.12 the chaos scenario has auto-fired at since it was written,
// which is the useful coincidence: that cadence has been played against the
// densest field in the game and is known to be fast without filling the tunnel
// with tracers.
const RAPID_FIRE_INTERVAL=FIRE_INTERVAL/RAPID_FIRE_MULT;
// Seconds between the chaos scenario's own volleys, which nobody triggers. It
// keeps its own number rather than reading Rapid Fire's, which happens to be the
// same: the scenario is a stress test and the pickup is a reward, and tuning one
// should not move the other.
const CHAOS_FIRE_INTERVAL=0.12;

// The three kinds of powerup, in the order a drop draws from.
const POWERUP_KINDS=['shield','rapid','slow'];
// How each powerup is drawn and what the HUD calls it. The renderer reads the
// glyph and the two colours it pulses between; the footer reads the label for
// the badge that counts the pickup down.
const POWERUP_GLYPHS={
  shield:{char:'+',bright:C.BRIGHT_GREEN,dim:C.GREEN,label:'SHIELD'},
  rapid:{char:'!',bright:C.BRIGHT_CYAN,dim:C.CYAN,label:'RAPID'},
  slow:{char:'~',bright:C.BRIGHT_MAGENTA,dim:C.MAGENTA,label:'SLOW'},
};

// ===== Best score persistence =====
// localStorage throws rather than returning null in some privacy modes and
// file:// sandboxes, so every access is guarded and falls back to no history.
const BEST_SCORE_KEY='cmdSpaceRider.bestScore';

function loadBestScore(){
  try{
    const raw=localStorage.getItem(BEST_SCORE_KEY);
    if(raw===null)return 0;
    const n=parseInt(raw,10);
    return Number.isFinite(n)&&n>0?n:0;
  }catch(e){
    return 0;
  }
}

function saveBestScore(best){
  try{
    localStorage.setItem(BEST_SCORE_KEY,String(best));
  }catch(e){
    /* score stays for this session only */
  }
}

// ===== CRT overlay preference =====
// The overlay is on out of the box - the retro screen is the look the game is
// after - so anything other than a stored 'off' reads as on, and a browser that
// will not hand over its storage still gets the default rather than an error.
const CRT_KEY='cmdSpaceRider.crt';

function loadCrt(){
  try{
    return localStorage.getItem(CRT_KEY)!=='off';
  }catch(e){
    return true;
  }
}

function saveCrt(on){
  try{
    localStorage.setItem(CRT_KEY,on?'on':'off');
  }catch(e){
    /* the choice stays for this session only */
  }
}

const DEBUG_MODES=['mines','orbs','obstacleCollision','mineCollision','chaos'];
const DEBUG_MODE_NAMES={
  mines:'MINE FIELD',orbs:'ORB HARVEST',
  obstacleCollision:'COLLISION COURSE',mineCollision:'MINE SWEEPER',chaos:'CHAOS PROTOCOL',
};
const DEBUG_MODE_DESCS={
  mines:'Only mines. Pure evasion.',orbs:'Only orbs. Collect them all.',
  obstacleCollision:'Hit obstacles. Track every impact.',
  mineCollision:'Ram mines. Log collisions.',chaos:'Everything. Everywhere. All at once.',
};

// ===== Game Engine (port of game.ts) =====
class Game{
  constructor(){this.state=this.createInitialState()}
  createInitialState(){
    return{
      mode:'menu',debugMode:null,score:0,distance:0,shield:100,
      bestScore:loadBestScore(),
      speed:BASE_SPEED_START,baseSpeed:BASE_SPEED_START,boostSpeed:0.55,
      shipX:0,shipY:0,shipRoll:0,rollDir:0,rollCooldown:0,
      time:0,uiTime:0,gameTime:0,
      obstacles:[],orbs:[],mines:[],bullets:[],particles:[],powerups:[],stars:[],
      tunnelRadius:8,maxViewZ:200,
      lastObstacleIncreaseMinute:0,mineTrackTime:0,minesToPresent:0,
      mineSpawnTimers:[],firstMinuteElapsed:false,
      trackerCount:0,debugMenuSelected:0,chaosFireTimer:0,
      damageFlash:0,collectFlash:0,boosting:false,
      combo:0,comboTimer:0,
      warpLevel:1,warpFlash:0,
      rapidFire:0,slowMotion:0,fireTimer:0,
      sounds:[],
      paused:false,muted:false,shake:0,newBestFlash:0,newBestShown:false,
      screenWidth:80,screenHeight:24,
    };
  }
  // The perspective scale toScreen applies at a given depth, on its own. The
  // pulse cannon needs it away from a full projection: a shot holds the screen
  // column it was fired down, and that means undoing the scale rather than
  // applying it.
  projScale(gz){
    const s=this.state;
    const t=max(0,min(1,(gz+s.maxViewZ)/s.maxViewZ));
    return 0.15+t*0.85;
  }
  toScreen(gx,gy,gz){
    const s=this.state;
    const sw=s.screenWidth,sh=s.screenHeight;
    const gameTop=HUD_ROWS;
    const gameBottom=sh-FOOTER_ROWS;
    const gameH=gameBottom-gameTop;
    const t=max(0,min(1,(gz+s.maxViewZ)/s.maxViewZ));
    const scale=this.projScale(gz);
    const baseRow=gameTop+t*(gameH-2);
    const colRange=(sw-6)/2;
    const col=sw/2+(gx/s.tunnelRadius)*colRange*scale;
    const rowOffset=-(gy/s.tunnelRadius)*gameH*Y_FACTOR*scale;
    const row=baseRow+rowOffset;
    return{col:floor(col),row:floor(row),scale};
  }
  initStars(w,h){
    this.state.stars=[];
    const starChars=['.','\u00B7','*','+'];
    const starColors=[8,7,15,8,7];
    for(let i=0;i<40;i++){
      this.state.stars.push({
        x:floor(random()*w),y:floor(random()*h),
        speed:rand(0.3,1.5),
        char:starChars[floor(random()*starChars.length)],
        color:starColors[floor(random()*starColors.length)],
      });
    }
  }
  showDebugMenu(){this.state.mode='debugMenu';this.state.debugMenuSelected=0}
  startGame(mode){
    const s=this.state;
    s.debugMode=mode||null;s.mode='playing';
    s.score=0;s.distance=0;s.shield=100;
    s.baseSpeed=BASE_SPEED_START;s.boostSpeed=0.55;s.speed=s.baseSpeed;
    s.shipX=0;s.shipY=1;s.shipRoll=0;s.rollDir=0;s.rollCooldown=0;
    s.combo=0;s.comboTimer=0;
    s.warpLevel=1;s.warpFlash=0;
    s.rapidFire=0;s.slowMotion=0;s.fireTimer=0;
    s.obstacles=[];s.orbs=[];s.bullets=[];s.particles=[];s.powerups=[];s.mines=[];
    s.gameTime=0;s.lastObstacleIncreaseMinute=0;
    s.mineTrackTime=0;s.minesToPresent=0;s.mineSpawnTimers=[];
    s.firstMinuteElapsed=false;s.trackerCount=0;s.chaosFireTimer=0;
    s.damageFlash=0;s.collectFlash=0;s.boosting=false;
    s.paused=false;s.shake=0;s.newBestFlash=0;s.newBestShown=false;

    if(s.debugMode==='mines'){
      for(let i=0;i<40;i++)this.spawnMine(-i*10-30);
    }else if(s.debugMode==='orbs'){
      for(let i=0;i<100;i++)this.spawnOrb(-i*8-15);
    }else if(s.debugMode==='obstacleCollision'){
      for(let i=0;i<60;i++)this.spawnObstacle(-i*14-30);
    }else if(s.debugMode==='mineCollision'){
      for(let i=0;i<40;i++)this.spawnMine(-i*10-30);
    }else if(s.debugMode==='chaos'){
      for(let i=0;i<120;i++)this.spawnObstacle(-i*7-20);
      for(let i=0;i<50;i++)this.spawnOrb(-i*10-15);
      for(let i=0;i<25;i++)this.spawnMine(-i*12-30);
    }else{
      for(let i=0;i<60;i++){
        this.spawnObstacle(-i*14-30);
        if(random()<0.4)this.spawnOrb(-i*14-20);
      }
    }
  }
  endGame(){
    const s=this.state;
    s.mode='dead';
    // Debug scenarios are diagnostics rather than scored runs, so they never
    // set the best score. Only a normal run can beat it.
    if(s.debugMode===null&&s.score>s.bestScore){
      s.bestScore=s.score;
      saveBestScore(s.bestScore);
    }
  }
  spawnObstacle(z){
    this.state.obstacles.push({
      x:rand(-4.5,4.5),y:rand(0.5,4.5),z,
      rot:rand(0,TAU),rotSpeed:rand(-2,2),scale:rand(0.6,1.5),
    });
  }
  spawnOrb(z){
    this.state.orbs.push({x:rand(-4.5,4.5),y:rand(0.5,4.5),z,collected:false});
  }
  spawnMine(z){
    this.state.mines.push({
      x:rand(-4.5,4.5),y:rand(0.5,4.5),z,
      rot:rand(0,TAU),rotSpeed:rand(-2,2),scale:rand(0.66,1.65),hp:5,
    });
  }
  // The powerup a destroyed mine may leave behind, where it was destroyed.
  //
  // It costs one draw per kill and a second one on the kills that do drop, so a
  // seeded run's sequence now depends on how many mines it shot. That is what
  // test/engagement.mjs seeds for and it stays reproducible, but a figure quoted
  // off a flight taken before this existed will not reproduce against one taken
  // after it.
  //
  // A drop is placed where the mine was when the bullet reached it, which is
  // already one frame of advance past where the mine started that frame, and it
  // does not move until the next one: updatePowerups has run by the time
  // updateBullets calls this.
  //
  // The collision-tracking scenarios get nothing. They are diagnostics rather
  // than scored runs - neither pays a combo either - and a pickup drifting
  // through one is a moving part in a screen that exists to count collisions.
  dropPowerup(x,y,z){
    const s=this.state;
    if(s.debugMode==='obstacleCollision'||s.debugMode==='mineCollision')return;
    if(random()>=POWERUP_DROP_CHANCE)return;
    const kind=POWERUP_KINDS[floor(random()*POWERUP_KINDS.length)];
    s.powerups.push({x,y,z,kind});
  }
  spawnParticles(x,y,z,color,count){
    for(let i=0;i<count;i++){
      this.state.particles.push({
        x,y,z,vx:rand(-3,3),vy:rand(-3,3),vz:rand(-1,2),
        life:rand(0.3,0.8),maxLife:0.8,color,
      });
    }
  }
  handleMenuInput(justPressed){
    const s=this.state;
    if(s.mode==='menu'||s.mode==='dead'){
      if(justPressed.ENTER)this.startGame();
    }
    if(s.mode==='debugMenu'){
      if(justPressed.UP)s.debugMenuSelected=(s.debugMenuSelected-1+DEBUG_MODES.length)%DEBUG_MODES.length;
      if(justPressed.DOWN)s.debugMenuSelected=(s.debugMenuSelected+1)%DEBUG_MODES.length;
      if(justPressed.ENTER)this.startGame(DEBUG_MODES[s.debugMenuSelected]);
      for(let i=0;i<5;i++){
        if(justPressed['DIGIT_'+(i+1)])this.startGame(DEBUG_MODES[i]);
      }
    }
  }
  // Queue a one-shot sound for the frame being simulated. The queue is drained
  // by whoever can make a noise with it, which is the browser build alone.
  cue(name){this.state.sounds.push(name)}
  // Count a kill into the combo chain and hand back the multiplier it earns.
  // The first kill is worth x1, and each further one inside the window raises
  // it, so a chain pays more the faster it is strung together, up to COMBO_MAX.
  // A kill at the ceiling still re-arms the window, so the chain is held rather
  // than broken by pressing on past it.
  registerKill(){
    const s=this.state;
    s.combo=min(s.combo+1,COMBO_MAX);
    s.comboTimer=COMBO_TIME;
    return s.combo;
  }
  // One volley: the centre bolt from the muzzle and a wing bolt either side,
  // half a unit apart and half a unit further forward.
  //
  // Every shot in the game comes out of here - the trigger, the held trigger
  // under Rapid Fire, and the chaos scenario's auto-fire - so the three cannot
  // come to fire different spreads.
  fireVolley(){
    const s=this.state;
    s.bullets.push({x:s.shipX,y:s.shipY,z:-2,life:2});
    s.bullets.push({x:s.shipX-0.25,y:s.shipY-0.05,z:-1.5,life:2});
    s.bullets.push({x:s.shipX+0.25,y:s.shipY-0.05,z:-1.5,life:2});
    this.cue('shot');
  }
  update(dt,keys,justPressed){
    const s=this.state;

    // The cue queue holds one frame's worth of sound. Emptying it here rather
    // than leaving it to the caller keeps it bounded in a build that never
    // reads it.
    s.sounds.length=0;

    // M is a global setting toggle, so it works in every mode. P only pauses a
    // run in progress.
    if(justPressed.M)s.muted=!s.muted;
    if(s.mode==='playing'&&justPressed.P)s.paused=!s.paused;

    // Presentation timers keep running while paused so an in-flight flash or
    // shake finishes instead of freezing on screen.
    s.uiTime+=dt;
    // The world's clock stops with the world, so a paused screen is a still
    // image. The gate names the mode as well as the flag: the title screen,
    // debug menu and game over screen animate off this clock and are not a
    // run in progress, so a bare `!s.paused` would freeze them too.
    if(!(s.mode==='playing'&&s.paused))s.time+=dt;
    s.damageFlash=max(0,s.damageFlash-dt*8);
    s.collectFlash=max(0,s.collectFlash-dt*8);
    s.newBestFlash=max(0,s.newBestFlash-dt);
    s.warpFlash=max(0,s.warpFlash-dt);
    s.shake=max(0,s.shake-dt);

    if(s.mode==='playing'&&!s.paused){
      // Powerup durations are counted in real seconds rather than in the world's,
      // and counted here rather than inside updatePlaying, for two reasons that
      // pull the same way. A pause stops them, because a pickup held across a
      // paused screen is ten free seconds; and Slow Motion does not stretch
      // itself, because the clock it slows is the one that would otherwise be
      // counting it down.
      s.rapidFire=max(0,s.rapidFire-dt);
      s.slowMotion=max(0,s.slowMotion-dt);
      this.updatePlaying(s.slowMotion>0?dt*SLOW_MOTION_SCALE:dt,keys,justPressed);
    }
  }
  updatePlaying(dt,keys,justPressed){
    const s=this.state;
    const moveSpeed=8;
    if(keys.A||keys.LEFT){s.shipX-=moveSpeed*dt}
    if(keys.D||keys.RIGHT){s.shipX+=moveSpeed*dt}
    if(keys.W||keys.UP){s.shipY+=moveSpeed*dt}
    if(keys.S||keys.DOWN){s.shipY-=moveSpeed*dt}

    this.updateBarrelRoll(dt,justPressed);
    this.updateCombo(dt);

    s.boosting=false;
    if(s.debugMode==='chaos'){
      s.speed=lerp(s.speed,s.boostSpeed,3*dt);s.boosting=true;
    }else if(keys.F||keys.SHIFT){
      s.speed=lerp(s.speed,s.boostSpeed,3*dt);s.boosting=true;
    }else{
      s.speed=lerp(s.speed,s.baseSpeed,2*dt);
    }

    const maxR=s.tunnelRadius-1.5;
    s.shipX=max(-maxR,min(maxR,s.shipX));
    s.shipY=max(0,min(maxR,s.shipY));

    // Fire bullets. A press always fires on the frame it arrives, with or without
    // Rapid Fire: the trigger answering the key is the whole feel of the cannon,
    // and gating it behind a cadence would swallow keypresses to buy a pickup
    // something to improve. What Rapid Fire adds is the held trigger - keep SPACE
    // down and the volleys repeat at RAPID_FIRE_INTERVAL until it runs out.
    if(justPressed.SPACE){
      this.fireVolley();
      s.fireTimer=0;
    }else if(s.rapidFire>0&&keys.SPACE){
      s.fireTimer+=dt;
      if(s.fireTimer>=RAPID_FIRE_INTERVAL){
        s.fireTimer-=RAPID_FIRE_INTERVAL;
        this.fireVolley();
      }
    }else{
      s.fireTimer=0;
    }

    if(s.debugMode==='chaos'){
      s.chaosFireTimer+=dt;
      if(s.chaosFireTimer>=CHAOS_FIRE_INTERVAL){
        s.chaosFireTimer=0;
        this.fireVolley();
      }
    }

    const advance=s.speed*60*dt;
    s.distance+=advance;

    if(s.debugMode!=='obstacleCollision'&&s.debugMode!=='mineCollision'){
      s.score+=floor(advance*10*(s.speed/s.baseSpeed));
    }

    // First crossing of the stored best in a normal run raises the HUD banner.
    // A best of 0 means there is nothing to beat yet, so the first run is quiet.
    if(s.debugMode===null&&!s.newBestShown&&s.bestScore>0&&s.score>s.bestScore){
      s.newBestShown=true;
      s.newBestFlash=NEW_BEST_FLASH_TIME;
    }

    s.baseSpeed=BASE_SPEED_START+s.distance*0.00002;
    s.boostSpeed=s.baseSpeed*1.8;
    s.gameTime+=dt;

    this.updateWarpLevel();
    this.updateObstacleScaling();
    this.updateMineSpawning(dt);
    this.updateObstacles(advance,dt);
    this.updateOrbs(advance);
    this.updateMines(advance,dt);
    this.updatePowerups(advance,dt);
    this.updateBullets(dt,advance);
    this.updateParticles(dt,advance);
    this.updateStars(dt);
  }
  // The difficulty step the run has reached, and the transition when it moves.
  //
  // It reads gameTime on the same WARP_INTERVAL boundary updateObstacleScaling
  // thickens the field on, but keeps its own counter rather than sharing
  // lastObstacleIncreaseMinute: that one is held still in the scenarios that do
  // not scale their field, and a run whose obstacles are fixed still gets faster
  // and still crosses the boundary the banner names.
  //
  // Level 1 is the opening minute, so the first transition a run ever sees is the
  // one that raises WARP LEVEL 2.
  updateWarpLevel(){
    const s=this.state;
    const level=floor(s.gameTime/WARP_INTERVAL)+1;
    if(level<=s.warpLevel)return;
    s.warpLevel=level;
    s.warpFlash=WARP_FLASH_TIME;
  }
  // Dropped powerups: carried in by the tunnel and pulled toward the ship.
  //
  // The drift is what makes a drop worth chasing rather than a coin flip about
  // where the mine happened to die. It closes on the ship in x and y at
  // POWERUP_DRIFT a second while the tunnel carries it forward at the run's own
  // speed, so a drop from a mine killed dead ahead falls into the ship and one
  // killed out by a wall is a decision about whether to go and get it.
  //
  // Collection uses the same bounding-box overlap the orbs use, against the
  // ship's drawn sprite, so a pickup registers where the player sees the two
  // meet. Nothing here is gated on the barrel roll: rolling through a powerup
  // collects it, because the roll is invincibility to damage and not a state of
  // not being there.
  updatePowerups(advance,dt){
    const s=this.state;
    const shipScr=this.toScreen(s.shipX,s.shipY,0);
    for(let i=s.powerups.length-1;i>=0;i--){
      const p=s.powerups[i];
      p.z+=advance;
      // Past the ship it is gone for good. Unlike an obstacle or an orb there is
      // nothing to recycle: a drop is the record of one mine, and putting it back
      // at the far end would be a second reward for the same kill.
      if(p.z>10){s.powerups.splice(i,1);continue}
      const dx=s.shipX-p.x;
      const dy=s.shipY-p.y;
      const dist=sqrt(dx*dx+dy*dy);
      if(dist>0.0001){
        const step=min(dist,POWERUP_DRIFT*dt);
        p.x+=(dx/dist)*step;
        p.y+=(dy/dist)*step;
      }
      if(p.z>-20&&p.z<5){
        const pScr=this.toScreen(p.x,p.y,p.z);
        const size=max(1,floor(pScr.scale*2));
        const half=floor(size/2);
        const drow=shipScr.row-pScr.row;
        if(abs(shipScr.col-pScr.col)<=SHIP_HALF_W+half&&
           drow<=2+half&&drow>=-(1+half)){
          this.collectPowerup(p);
          s.powerups.splice(i,1);
        }
      }
    }
  }
  // What a pickup does, and the flash and burst that say it happened.
  collectPowerup(p){
    const s=this.state;
    if(p.kind==='shield')s.shield=min(100,s.shield+POWERUP_SHIELD_GAIN);
    else if(p.kind==='rapid')s.rapidFire=RAPID_FIRE_TIME;
    else s.slowMotion=SLOW_MOTION_TIME;
    s.collectFlash=0.6;
    this.cue('powerup');
    this.spawnParticles(p.x,p.y,p.z,POWERUP_GLYPHS[p.kind].bright,12);
  }
  // Barrel roll. Q rolls left and E rolls right, for as long as ROLL_TIME, and
  // the ship is untouchable for the whole of it - that dodge is what the move
  // is for. The cooldown starts with the roll rather than with its end, so it
  // bounds how much of a run can be spent invincible.
  updateBarrelRoll(dt,justPressed){
    const s=this.state;
    if(s.rollCooldown>0)s.rollCooldown=max(0,s.rollCooldown-dt);

    if(s.shipRoll>0){
      s.shipRoll=max(0,s.shipRoll-dt);
      if(s.shipRoll===0)s.rollDir=0;
      return;
    }

    if(s.rollCooldown>0)return;
    const dir=justPressed.Q?-1:justPressed.E?1:0;
    if(dir===0)return;

    s.shipRoll=ROLL_TIME;
    s.rollDir=dir;
    s.rollCooldown=ROLL_COOLDOWN;
  }
  // True while a barrel roll is carrying the ship through whatever it hits.
  invincible(){return this.state.shipRoll>0}
  // Combo decay. Every kill re-arms the window in registerKill; COMBO_TIME
  // without one drops the chain, so the multiplier only pays for kills strung
  // together rather than for a long run's total.
  updateCombo(dt){
    const s=this.state;
    if(s.comboTimer<=0)return;
    s.comboTimer=max(0,s.comboTimer-dt);
    if(s.comboTimer===0)s.combo=0;
  }
  updateObstacleScaling(){
    const s=this.state;
    if(!s.debugMode||s.debugMode==='obstacleCollision'||s.debugMode==='chaos'){
      const currentMinute=floor(s.gameTime/60);
      if(currentMinute>s.lastObstacleIncreaseMinute){
        const newCount=Math.ceil(s.obstacles.length*0.1);
        for(let i=0;i<newCount;i++)this.spawnObstacle(-rand(30,RECYCLE_Z));
        s.lastObstacleIncreaseMinute=currentMinute;
      }
    }
  }
  updateMineSpawning(dt){
    const s=this.state;
    if(s.debugMode&&s.debugMode!=='mines'&&s.debugMode!=='mineCollision'&&s.debugMode!=='chaos')return;
    if(s.debugMode==='mines'||s.debugMode==='mineCollision'||s.debugMode==='chaos'){
      s.mineTrackTime+=dt;
      if(s.mineTrackTime>=5){
        s.mineTrackTime=0;
        const count=s.debugMode==='chaos'?3:2;
        for(let i=0;i<count;i++)this.spawnMine(-rand(30,60));
      }
    }else{
      s.mineTrackTime+=dt;
      if(!s.firstMinuteElapsed){
        if(s.mineTrackTime>=60){
          s.firstMinuteElapsed=true;s.mineTrackTime=0;
          s.minesToPresent+=1;s.mineSpawnTimers=[];
          for(let i=0;i<s.minesToPresent;i++)s.mineSpawnTimers.push(floor(30*random()));
        }
      }else{
        if(s.mineTrackTime>=30){
          s.mineTrackTime=0;s.minesToPresent+=1;s.mineSpawnTimers=[];
          for(let i=0;i<s.minesToPresent;i++)s.mineSpawnTimers.push(floor(30*random()));
        }
        for(let i=s.mineSpawnTimers.length-1;i>=0;i--){
          if(s.mineTrackTime>=s.mineSpawnTimers[i]){
            this.spawnMine(-rand(30,60));s.mineSpawnTimers.splice(i,1);
          }
        }
      }
    }
  }
  updateObstacles(advance,dt){
    const s=this.state;
    if(s.debugMode&&s.debugMode!=='obstacleCollision'&&s.debugMode!=='chaos')return;
    const shipScr=this.toScreen(s.shipX,s.shipY,0);
    for(let i=s.obstacles.length-1;i>=0;i--){
      const o=s.obstacles[i];
      o.z+=advance;o.rot+=o.rotSpeed*dt;
      if(o.z>10){o.z-=RECYCLE_Z;o.x=rand(-4.5,4.5);o.y=rand(0.5,4.5);o.scale=rand(0.6,1.5)}
      if(o.z>-20&&o.z<5){
        const oScr=this.toScreen(o.x,o.y,o.z);
        const size=max(1,floor(oScr.scale*2.5));
        const half=floor(size/2);
        const dy=shipScr.row-oScr.row;
        if(abs(shipScr.col-oScr.col)<=SHIP_HALF_W+half&&
           dy<=2+half&&dy>=-(1+half)){
          if(this.invincible())continue; // rolled clean through it
          s.shake=SHAKE_TIME; // every branch below is an impact
          this.cue('damage');
          if(s.debugMode==='obstacleCollision'){
            s.trackerCount++;s.damageFlash=0.5;
            this.spawnParticles(o.x,o.y,o.z,208,8);
            o.z=-RECYCLE_Z+rand(-10,10);
          }else if(s.debugMode==='chaos'){
            s.damageFlash=0.3;this.spawnParticles(o.x,o.y,o.z,208,8);
            o.z=-RECYCLE_Z+rand(-10,10);
          }else{
            s.shield-=25;s.damageFlash=0.8;
            this.spawnParticles(o.x,o.y,o.z,9,8);
            o.z=-RECYCLE_Z+rand(-10,10);
            if(s.shield<=0){s.shield=0;this.endGame();return}
          }
        }
      }
    }
  }
  updateOrbs(advance){
    const s=this.state;
    if(s.debugMode&&s.debugMode!=='orbs'&&s.debugMode!=='chaos')return;
    const shipScr=this.toScreen(s.shipX,s.shipY,0);
    for(let i=s.orbs.length-1;i>=0;i--){
      const o=s.orbs[i];
      o.z+=advance;
      if(o.z>10){o.z-=RECYCLE_Z;o.x=rand(-4.5,4.5);o.y=rand(0.5,4.5);o.collected=false}
      if(!o.collected&&o.z>-20&&o.z<5){
        const oScr=this.toScreen(o.x,o.y,o.z);
        const size=max(1,floor(oScr.scale*2));
        const half=floor(size/2);
        const dy=shipScr.row-oScr.row;
        if(abs(shipScr.col-oScr.col)<=SHIP_HALF_W+half&&
           dy<=2+half&&dy>=-(1+half)){
          o.collected=true;s.score+=500;
          s.shield=min(100,s.shield+10);s.collectFlash=0.6;
          this.cue('orb');
          this.spawnParticles(o.x,o.y,o.z,10,10);
        }
      }
    }
  }
  updateMines(advance,dt){
    const s=this.state;
    if(s.debugMode&&s.debugMode!=='mines'&&s.debugMode!=='mineCollision'&&s.debugMode!=='chaos')return;
    const shipScr=this.toScreen(s.shipX,s.shipY,0);
    for(let i=s.mines.length-1;i>=0;i--){
      const m=s.mines[i];
      m.z+=advance;m.rot+=m.rotSpeed*dt;
      if(m.z>10){
        if(s.debugMode==='mines'||s.debugMode==='mineCollision'){
          m.z=-rand(30,60);m.x=rand(-4.5,4.5);m.y=rand(0.5,4.5);m.hp=5;continue;
        }
        s.mines.splice(i,1);continue;
      }
      if(m.z>-20&&m.z<5){
        const mScr=this.toScreen(m.x,m.y,m.z);
        const size=max(1,floor(mScr.scale*2.5));
        const half=floor(size/2);
        const dy=shipScr.row-mScr.row;
        if(abs(shipScr.col-mScr.col)<=SHIP_HALF_W+half&&
           dy<=2+half&&dy>=-(1+half)){
          if(this.invincible())continue; // rolled clean through it
          s.shake=SHAKE_TIME; // every branch below is an impact
          this.cue('damage');
          if(s.debugMode==='mineCollision'){
            s.trackerCount++;s.damageFlash=0.5;
            this.spawnParticles(m.x,m.y,m.z,9,8);
            m.z=-rand(30,60);m.x=rand(-4.5,4.5);m.y=rand(0.5,4.5);m.hp=5;
          }else if(s.debugMode==='chaos'){
            s.damageFlash=0.5;this.spawnParticles(m.x,m.y,m.z,9,15);
            s.mines.splice(i,1);
          }else{
            s.shield-=35;s.damageFlash=1.0;
            this.spawnParticles(m.x,m.y,m.z,9,15);s.mines.splice(i,1);
            if(s.shield<=0){s.shield=0;this.endGame();return}
          }
        }
      }
    }
  }
  // Whether a shot's tracer met a target's block on the screen at any point in
  // the frame just stepped.
  //
  // The screen is the whole of the hit test, because the screen is the whole of
  // what the player has. drawBullets puts the tracer on two cells, the row it is
  // projected to and the row above, and on neither of them where that column has
  // left the corridor; drawEntitiesFar gives a target a block of `size` cells
  // about its own projected centre. The two either share a cell or they do not,
  // and neither a target that is not being drawn nor a tracer that is not being
  // drawn can be half of a contact.
  //
  // The corridor clip is read from tracerLit, which is what drawBullets draws
  // by, so the two cannot come to state different corridors. Leaving it out -
  // which is how this stood until the clip was measured - let a shot register
  // from a column the tunnel no longer reaches: drawEntitiesFar draws a target's
  // block whether or not the corridor covers it, so the player saw the block,
  // saw no bolt, and the block died anyway. Walked as geometry over every firing
  // column and height the ship can hold, every depth of a shot's life and every
  // legal target placement, 594 undrawn-tracer configurations at 80x24
  // registered a kill, 2241 at 60x20 and 76 at 205x50; `npm run probe --
  // free-flight` prints the walk. Reading the clip here costs nothing
  // measurable: every band the suite pins, at all three grids and in both
  // builds, came back on the figure it had.
  //
  // Depth is not compared. Shot and target are drawn at their own depths, so two
  // things a frame apart in depth can be a cell apart on the screen and two
  // things level in depth can be rows apart; testing them on one projected
  // plane, as this used to, asks a question the player is never shown the answer
  // to. A kill therefore lands with the shot well off the target's depth, tens
  // of units either way, which is what this projection draws.
  //
  // Columns keep their slack and rows have none. A column is countable on the
  // screen and a row is not - Y_FACTOR squashes the tunnel's height, and a
  // target's row moves at its depth's scale while the ship's moves at full
  // scale - so a row of slack was buying an aim the player could not have taken.
  // Under the contact rule height stops deciding a kill at all: a tracer climbs
  // its whole column and meets whatever is drawn in it.
  //
  // The frame is swept rather than sampled at its ends, so a long dt cannot
  // carry a tracer over a block between two frames and leave the pair untested.
  // Both sides move: the shot outward by its travel, the target inward by
  // `advance`, which updateObstacles has already applied by the time this runs -
  // so the target started the frame at tz - advance.
  contacts(aimX,bulletY,bulletFromZ,travel,tx,ty,tz,advance,slackCols){
    const s=this.state;
    const gameTop=HUD_ROWS;
    const gameBottom=s.screenHeight-FOOTER_ROWS;
    // Holding the firing column means the shot's own column is constant for the
    // whole flight, so it is worth one projection rather than one per sample.
    const bCol=this.toScreen(aimX/this.projScale(bulletFromZ),bulletY,bulletFromZ).col;
    // A target's column and its block both grow with its scale, which is
    // monotonic in depth, so the frame's two ends bound everything between them:
    // a bullet column outside that bound cannot touch the block at any point of
    // the frame, and the sweep below can be skipped outright.
    //
    // The bound is the distance to the span the two ends enclose, not the nearer
    // of the two distances. The column the target passes through mid frame is
    // nearer than either end whenever the shot's column lies between them, so
    // taking the nearer end skips a contact the sweep would have found - by
    // measurement, 703 of 7625 contacts at 205x50 at a sixth of a second a
    // frame, which is the slowest rate the suite walks.
    let widest=-1;
    let lo=Infinity;
    let hi=-Infinity;
    for(const z of [tz-advance,tz]){
      widest=max(widest,floor(max(1,floor(this.projScale(z)*2.5))/2));
      const col=this.toScreen(tx,ty,z).col;
      lo=min(lo,col);
      hi=max(hi,col);
    }
    const nearest=bCol<lo?lo-bCol:bCol>hi?bCol-hi:0;
    if(nearest>widest+slackCols)return false;
    const steps=max(1,ceil((travel+advance)/SWEEP_STEP));
    for(let k=0;k<=steps;k++){
      const f=k/steps;
      const targetZ=tz-advance*(1-f);
      // drawEntitiesFar draws nothing outside this depth band.
      if(targetZ<-s.maxViewZ||targetZ>5)continue;
      const tScr=this.toScreen(tx,ty,targetZ);
      if(tScr.row<gameTop||tScr.row>=gameBottom)continue;
      const bulletZ=bulletFromZ-travel*f;
      const bScr=this.toScreen(aimX/this.projScale(bulletZ),bulletY,bulletZ);
      // drawBullets drops the whole tracer when its lower half is off the play
      // area, and draws the upper half only when there is a row above for it.
      if(bScr.row<gameTop||bScr.row>=gameBottom)continue;
      const half=floor(max(1,floor(this.projScale(targetZ)*2.5))/2);
      if(abs(bScr.col-tScr.col)>half+slackCols)continue;
      // The block is clipped to the play area as drawBlock clips it; the tracer
      // is its own row and, where there is room for it, the row above.
      const blockTop=max(gameTop,tScr.row-half);
      const blockBottom=min(gameBottom-1,tScr.row+half);
      const lowLit=tracerLit(bScr.col,bScr.row,gameTop,gameBottom,s.screenWidth);
      const highLit=bScr.row-1>=gameTop
        &&tracerLit(bScr.col,bScr.row-1,gameTop,gameBottom,s.screenWidth);
      if(!lowLit&&!highLit)continue; // nothing drawn, so nothing to register
      const tracerTop=highLit?bScr.row-1:bScr.row;
      const tracerBottom=lowLit?bScr.row:bScr.row-1;
      if(tracerTop<=blockBottom&&tracerBottom>=blockTop)return true;
    }
    return false;
  }
  // Bullet flight and what it hits.
  //
  // Horizontally a shot holds the screen column it was fired down rather than a
  // line of constant world x, because the column is the player's whole aim: the
  // target is one glyph in one of about seventy columns, the ship is another,
  // and there is no reticle to do it any other way. A world-space shot
  // converges on the vanishing point as it recedes while the target it was
  // aimed at diverges from it, so a shot lined up at the muzzle lands wide of
  // anything off-centre, and the wider the range the wider it lands. Paying
  // `b.x` forward by the ratio of the two scales holds the column instead, and
  // the shot then draws as the straight line up the screen a player already
  // reads it as.
  //
  // Vertically it stays in world space, because that axis reads differently.
  // Y_FACTOR squashes the tunnel's whole height into about eight rows at the
  // muzzle, so nobody aims by row - they aim by how high in the tunnel the
  // target sits, which is world y. Holding the row instead measured worse at
  // every range, since it puts the shot above a target the player had lined up
  // correctly.
  //
  // Holding the column is also why a shot fired from near a wall ends up
  // outside the drawn tunnel partway through its flight: the corridor
  // converges on the vanishing point and the shot does not. That is left
  // alone here, because the column is the aim and the hit rates ride on it.
  // drawBullets stops drawing the tracer there instead, and says
  // why the flight may not be cut short with it.
  //
  // What a shot then registers against is decided on the screen, by contacts
  // above: a tracer drawn on a target's block destroys it, and one that is not
  // drawn on it does not. That second half covers a tracer drawn beside the
  // block and a tracer not drawn at all, which are the two ways of not being
  // drawn on it - so a shot whose column has left the corridor registers nothing
  // for as long as it is dark, and a block the player can see with no bolt on it
  // survives.
  updateBullets(dt,advance){
    const s=this.state;
    const travel=60*dt;
    const slackCols=shotSlackCols(s.screenWidth);
    for(let i=s.bullets.length-1;i>=0;i--){
      const b=s.bullets[i];
      const fromZ=b.z;
      b.z-=travel;b.life-=dt;
      if(b.life<=0){s.bullets.splice(i,1);continue}
      // x * scale is constant along a screen ray, so carrying x forward by the
      // ratio of the two scales holds the column the shot was fired at.
      b.x*=this.projScale(fromZ)/this.projScale(b.z);
      const aimX=b.x*this.projScale(b.z);
      let hit=false;
      // Bullet-obstacle collision, taken on the screen the player is watching.
      if(!s.debugMode||s.debugMode==='obstacleCollision'||s.debugMode==='chaos'){
        for(let j=s.obstacles.length-1;j>=0;j--){
          const o=s.obstacles[j];
          if(!this.contacts(aimX,b.y,fromZ,travel,o.x,o.y,o.z,advance,slackCols))continue;
          this.spawnParticles(o.x,o.y,o.z,208,12);
          if(s.debugMode==='chaos')s.trackerCount++;
          // The collision-tracking modes are not scored, so a kill in one of
          // them carries no multiplier and never starts a chain either.
          if(s.debugMode!=='obstacleCollision'&&s.debugMode!=='mineCollision')
            s.score+=200*this.registerKill();
          o.z=-RECYCLE_Z+rand(-10,10);
          s.bullets.splice(i,1);hit=true;break;
        }
      }
      if(hit)continue;
      // Bullet-mine collision, on the same rule.
      if(!s.debugMode||s.debugMode==='mines'||s.debugMode==='mineCollision'||s.debugMode==='chaos'){
        for(let j=s.mines.length-1;j>=0;j--){
          const m=s.mines[j];
          if(!this.contacts(aimX,b.y,fromZ,travel,m.x,m.y,m.z,advance,slackCols))continue;
          m.hp-=1;this.spawnParticles(m.x,m.y,m.z,9,5);
          if(m.hp<=0){
            this.spawnParticles(m.x,m.y,m.z,9,20);
            this.cue('mine');
            this.dropPowerup(m.x,m.y,m.z);
            if(s.debugMode==='chaos')s.trackerCount++;
            if(s.debugMode!=='obstacleCollision'&&s.debugMode!=='mineCollision')
              s.score+=500*this.registerKill();
            s.mines.splice(j,1);
          }
          s.bullets.splice(i,1);break;
        }
      }
    }
  }
  updateParticles(dt,advance){
    const s=this.state;
    for(let i=s.particles.length-1;i>=0;i--){
      const p=s.particles[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=(p.vz+advance)*dt;
      p.life-=dt;
      if(p.life<=0)s.particles.splice(i,1);
    }
  }
  updateStars(dt){
    const s=this.state;
    const speedMul=s.speed/s.baseSpeed;
    for(const star of s.stars)star.y+=star.speed*speedMul*dt*30;
  }
}

// ===== Rendering (port of render.ts) =====

function gameToScreen(gx,gy,gz,sw,sh,gameTop,gameBottom,tunnelRadius,maxZ){
  const gameH=gameBottom-gameTop;
  const t=clamp((gz+maxZ)/maxZ,0,1);
  const scale=0.15+t*0.85;
  const baseRow=gameTop+t*(gameH-2);
  const colRange=(sw-6)/2;
  const col=sw/2+(gx/tunnelRadius)*colRange*scale;
  const rowOffset=-(gy/tunnelRadius)*(gameH*0.4)*scale;
  const row=baseRow+rowOffset;
  return{col:floor(col),row:floor(row),scale};
}

function renderGame(screen,state){
  const w=screen.width,h=screen.height;
  const gameTop=HUD_ROWS,gameBottom=h-FOOTER_ROWS;
  screen.clear(C.BLACK);
  drawStarfield(screen,state,gameTop,gameBottom);
  drawTunnel(screen,state,gameTop,gameBottom);
  drawEntitiesFar(screen,state,gameTop,gameBottom);
  drawBullets(screen,state,gameTop,gameBottom);
  drawParticles(screen,state,gameTop,gameBottom);
  drawShip(screen,state,gameTop,gameBottom);
  drawHUD(screen,state);
  drawFooter(screen,state);
  drawEffects(screen,state);
  // The damage shake is a canvas offset applied in frame(), not a grid change,
  // so the character buffer itself needs nothing here.
  if(state.paused)drawPauseOverlay(screen,state);
}

/**
 * Damage screen shake as a canvas pixel offset, fading with the shake timer.
 * Returns the {x,y} translation to apply before drawing the character grid.
 */
function shakeOffset(state){
  if(state.shake<=0)return{x:0,y:0};
  const strength=state.shake/SHAKE_TIME;
  return{
    x:sin(state.uiTime*90)*SHAKE_PIXELS*strength,
    y:cos(state.uiTime*70)*SHAKE_PIXELS*0.8*strength,
  };
}

// What each wall colour becomes while a warp transition is running.
//
// The tunnel is blue at the far end and cyan at the near one, and a warp carries
// the whole ramp across to magenta and out to white at the mouth. It is a lookup
// rather than an arithmetic shift because the palette is ANSI 256 indices and
// there is no arithmetic between two of them that means anything: the five
// colours drawTunnel can pick are listed, and a colour not in the list is left
// as it was.
const WARP_WALLS={
  [C.DARK_BLUE]:C.MAGENTA,
  [C.BLUE]:C.NEON_MAGENTA,
  [C.BRIGHT_BLUE]:C.BRIGHT_MAGENTA,
  [C.CYAN]:C.BRIGHT_MAGENTA,
  [C.BRIGHT_CYAN]:C.BRIGHT_WHITE,
};

// A wall colour as the warp transition leaves it, which is the colour itself
// whenever no transition is running.
function warpWallColor(color,state){
  if(state.warpFlash<=0)return color;
  const shifted=WARP_WALLS[color];
  return shifted===undefined?color:shifted;
}

function drawStarfield(screen,state,gameTop,gameBottom){
  const h=screen.height,w=screen.width;
  for(const star of state.stars){
    const sy=star.y%h;
    const y=sy<0?sy+h:sy;
    if(y>=gameTop&&y<gameBottom){
      screen.put(floor(star.x)%w,floor(y),star.char,star.color,C.BLACK);
    }
  }
}

function drawTunnel(screen,state,gameTop,gameBottom){
  const w=screen.width;
  const gameH=gameBottom-gameTop;
  const ringSpacing=4;
  const ringOffset=floor(state.distance*0.3)%ringSpacing;
  for(let row=gameTop;row<gameBottom;row++){
    const t=(row-gameTop)/gameH;
    const {left:leftWall,right:rightWall}=tunnelSpan(row,gameTop,gameBottom,w);
    const thickness=max(1,floor(t*3));
    let wallChar,wallColor;
    const pulse=sin(state.time*3+row*0.15)*0.3+0.7;
    if(t<0.2){wallChar='\u2591';wallColor=pulse>0.6?C.DARK_BLUE:C.BLUE}
    else if(t<0.5){wallChar='\u2592';wallColor=pulse>0.6?C.BLUE:C.BRIGHT_BLUE}
    else if(t<0.8){wallChar='\u2593';wallColor=pulse>0.6?C.BRIGHT_BLUE:C.CYAN}
    else{wallChar='\u2588';wallColor=pulse>0.6?C.CYAN:C.BRIGHT_CYAN}
    // The ramp is picked first and shifted after, so the depth banding and the
    // pulse both survive the warp rather than being flattened by it.
    wallColor=warpWallColor(wallColor,state);
    for(let dx=0;dx<thickness;dx++){
      screen.put(leftWall-dx,row,wallChar,wallColor,C.BLACK);
      screen.put(rightWall+dx,row,wallChar,wallColor,C.BLACK);
    }
    const isRing=(row-gameTop+ringOffset)%ringSpacing===0;
    if(isRing&&t>0.1){
      const ringColor=warpWallColor(t>0.5?C.BRIGHT_CYAN:C.CYAN,state);
      screen.put(leftWall,row,'\u2563',ringColor,C.BLACK);
      screen.put(rightWall,row,'\u2560',ringColor,C.BLACK);
      // The floor dots are drawn in a wall colour and shift with the walls, or
      // a warp leaves a row of blue dots strung between two magenta walls.
      if(t>0.3){
        const dotColor=warpWallColor(C.DARK_BLUE,state);
        for(let x=leftWall+2;x<rightWall;x+=4)
          screen.put(x,row,'\u00B7',dotColor,C.BLACK);
      }
    }
  }
}

function drawEntitiesFar(screen,state,gameTop,gameBottom){
  const w=screen.width,h=screen.height;
  for(const o of state.obstacles){
    if(o.z<-state.maxViewZ||o.z>5)continue;
    const pos=gameToScreen(o.x,o.y,o.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row<gameTop||pos.row>=gameBottom)continue;
    const size=max(1,floor(pos.scale*2.5));
    const glow=sin(state.time*3+o.z)*0.3+0.5;
    const color=glow>0.5?C.BRIGHT_RED:C.RED;
    const ch=size>=2?'\u2593':'\u25A0';
    drawBlock(screen,pos.col,pos.row,size,ch,color,gameTop,gameBottom);
  }
  for(const m of state.mines){
    if(m.z<-state.maxViewZ||m.z>5)continue;
    const pos=gameToScreen(m.x,m.y,m.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row<gameTop||pos.row>=gameBottom)continue;
    const size=max(1,floor(pos.scale*2.5));
    const blink=sin(state.time*8)>0;
    const color=blink?C.BRIGHT_RED:C.GRAY;
    const ch=blink?'\u25C8':'\u25A0';
    drawBlock(screen,pos.col,pos.row,size,ch,color,gameTop,gameBottom);
  }
  for(const o of state.orbs){
    if(o.collected||o.z<-state.maxViewZ||o.z>5)continue;
    const pos=gameToScreen(o.x,o.y+sin(state.time*4+o.x)*0.3,o.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row<gameTop||pos.row>=gameBottom)continue;
    const size=max(1,floor(pos.scale*2));
    const pulse=sin(state.time*5)*0.3+0.7;
    const color=pulse>0.6?C.BRIGHT_GREEN:C.GREEN;
    const ch=size>=2?'\u25C6':'\u2666';
    drawBlock(screen,pos.col,pos.row,size,ch,color,gameTop,gameBottom);
  }
  // Dropped powerups. Each is one glyph in its own colour rather than a shaded
  // block, because what it does is the only thing worth reading off it at a
  // glance and there are three of them to tell apart: + restores shield, ! is
  // rapid fire, ~ is slow motion. The pulse is offset by depth, so a pair of
  // drops in the air together does not blink in unison.
  for(const p of state.powerups){
    if(p.z<-state.maxViewZ||p.z>5)continue;
    const pos=gameToScreen(p.x,p.y,p.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row<gameTop||pos.row>=gameBottom)continue;
    const size=max(1,floor(pos.scale*2));
    const spec=POWERUP_GLYPHS[p.kind];
    const pulse=sin(state.time*6+p.z)*0.3+0.7;
    const color=pulse>0.6?spec.bright:spec.dim;
    drawBlock(screen,pos.col,pos.row,size,spec.char,color,gameTop,gameBottom);
  }
}

function drawBlock(screen,cx,cy,size,ch,color,gameTop,gameBottom){
  const half=floor(size/2);
  for(let dy=-half;dy<=half;dy++){
    for(let dx=-half;dx<=half;dx++){
      const y=cy+dy;
      if(y>=gameTop&&y<gameBottom)screen.put(cx+dx,y,ch,color,C.BLACK);
    }
  }
}

/**
 * The tracer, drawn only while it is still inside the corridor.
 *
 * A shot holds the screen column it was fired down - updateBullets says why
 * the aim depends on that - while the drawn tunnel converges on the vanishing
 * point, so a shot fired from near a wall crosses that wall partway up, and
 * the rest of the flight would otherwise be drawn out in the black margin
 * with the tunnel some distance to one side.
 *
 * The corridor is what the walls enclose, not the walls themselves: drawTunnel
 * lays its glyph on tunnelSpan's own two columns and thickens outward from
 * there, so the corridor runs from left + 1 to right - 1. Admitting the wall
 * columns punched a hole in the wall instead of stopping the shot at it, since
 * drawBullets runs after drawTunnel and the wall is one cell thick over the top
 * two thirds of the screen: a tracer landing on one replaced the block glyph
 * with a bar, and the hole travelled up the wall with the shot.
 *
 * Crossing the wall is also where the shot stops being able to hit anything.
 * Targets spawn within four and a half units of the axis and the walls are
 * drawn at eight, so every target sits inside this span at every depth; a
 * shot whose column has left the span is in a column no target can occupy at
 * that depth, and stays there for the rest of its life. Stopping the tracer
 * short of the wall says so. Clamping it back into the corridor instead would
 * keep drawing a shot that can no longer hit a thing in there, and would put
 * back the column drift the aiming fix removed.
 *
 * A left-hand shot goes dark a few frames before its mirror on the right, and
 * that is quantisation rather than a second fault. tunnelSpan is symmetric
 * about floor(w / 2) while gameToScreen floors a continuous column, so a shot
 * at -x lands ceil cells out and one at +x floor cells out - the left side
 * reaches the wall a column sooner. Rounding the column instead makes the two
 * agree exactly, and costs real hits: measured over the suite's own long-range
 * sweep it took the centre bullet from 44/58 to 37/60, under the 65% the band
 * is pinned at, because SHOT_SLACK_COLS is tuned against the floor. Drawing
 * rounded while registering floored is worse again - the glyph the player aims
 * by would sit a column off what the hit test reads, on half of all positions.
 *
 * The hit test reads the same clip, and that is the whole of what it shares
 * with this: a frame that draws no tracer registers nothing on that frame. The
 * flight itself is not cut short. The span the walls are drawn on runs a little
 * narrower than the tunnel radius projects to, so culling the bullet outright
 * where it crosses would cost real hits at the far end - instead the shot goes
 * dark, and lights again if the corridor widens back around its column.
 *
 * Each half is tested on its own row, because the span narrows going up and the
 * dim upper half leaves the corridor first.
 */
function drawBullets(screen,state,gameTop,gameBottom){
  const w=screen.width,h=screen.height;
  const inCorridor=(col,row)=>tracerLit(col,row,gameTop,gameBottom,w);
  for(const b of state.bullets){
    const pos=gameToScreen(b.x,b.y,b.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row<gameTop||pos.row>=gameBottom)continue;
    if(inCorridor(pos.col,pos.row))screen.put(pos.col,pos.row,'\u2502',C.BRIGHT_CYAN,C.BLACK);
    if(pos.row-1>=gameTop&&inCorridor(pos.col,pos.row-1))
      screen.put(pos.col,pos.row-1,'\u2502',C.CYAN,C.BLACK);
  }
}

function drawParticles(screen,state,gameTop,gameBottom){
  const w=screen.width,h=screen.height;
  const particleChars=['*','+','\u00B7','.'];
  for(const p of state.particles){
    const pos=gameToScreen(p.x,p.y,p.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row>=gameTop&&pos.row<gameBottom&&pos.col>=0&&pos.col<w){
      const fade=p.life/p.maxLife;
      const ch=particleChars[floor((1-fade)*(particleChars.length-1))];
      const color=fade>0.5?p.color:C.GRAY;
      screen.put(pos.col,pos.row,ch,color,C.BLACK);
    }
  }
}

// The ship's wings a quarter of a roll apart. The sprite is three cells wide,
// so the roll is told by the wings alone: the nose and body stay where they
// are, which is what a roll about the long axis actually does.
const ROLL_WINGS=[['<','>'],['\\','/'],['-','-'],['/','\\']];

// The wing pair for the roll the ship is in, level when it is in none. E reads
// the table forwards and Q reads it backwards, which mirrors the spin.
function rollWings(state){
  if(state.shipRoll<=0)return ROLL_WINGS[0];
  const turns=ROLL_WINGS.length;
  const elapsed=(ROLL_TIME-state.shipRoll)/ROLL_TIME;
  const step=min(turns-1,max(0,floor(elapsed*turns)));
  return state.rollDir<0?ROLL_WINGS[(turns-step)%turns]:ROLL_WINGS[step];
}

function drawShip(screen,state,gameTop,gameBottom){
  const w=screen.width,h=screen.height;
  const pos=gameToScreen(state.shipX,state.shipY,0,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
  const cx=pos.col,cy=pos.row;
  // Mid-roll the wings turn and the hull goes white, so the invincibility the
  // roll grants is visible rather than something the player has to remember.
  const rolling=state.shipRoll>0;
  const [leftWing,rightWing]=rollWings(state);
  const hullColor=rolling?C.BRIGHT_WHITE:C.BRIGHT_CYAN;
  const wingColor=rolling?C.BRIGHT_MAGENTA:C.BRIGHT_BLUE;
  if(cy-1>=gameTop&&cy+1<gameBottom){
    screen.put(cx,cy-1,'\u25B2',hullColor,C.BLACK);
    screen.put(cx-1,cy,leftWing,wingColor,C.BLACK);
    screen.put(cx,cy,'\u2588',hullColor,C.BLACK);
    screen.put(cx+1,cy,rightWing,wingColor,C.BLACK);
    screen.put(cx-1,cy+1,'\u2568',C.CYAN,C.BLACK);
    screen.put(cx+1,cy+1,'\u2568',C.CYAN,C.BLACK);
    const engineGlow=sin(state.time*20)>0;
    const glowColor=state.boosting?C.BRIGHT_MAGENTA:C.BRIGHT_BLUE;
    if(engineGlow&&cy+2<gameBottom){
      screen.put(cx-1,cy+2,'\u2502',glowColor,C.BLACK);
      screen.put(cx+1,cy+2,'\u2502',glowColor,C.BLACK);
    }
  }
}

function drawHUD(screen,state){
  const w=screen.width;
  screen.put(0,0,'\u2554',C.CYAN,C.BLACK);
  screen.hLine(1,0,w-2,'\u2550',C.CYAN,C.BLACK);
  screen.put(w-1,0,'\u2557',C.CYAN,C.BLACK);
  const title=' SPACE RIDER ';
  const titleX=floor((w-title.length)/2);
  screen.putString(titleX,0,title,C.BRIGHT_CYAN,C.BLACK);
  screen.put(0,1,'\u2551',C.CYAN,C.BLACK);
  screen.put(w-1,1,'\u2551',C.CYAN,C.BLACK);
  const scoreStr=state.debugMode==='obstacleCollision'||state.debugMode==='mineCollision'
    ?'SCORE: ---':`SCORE: ${state.score}`;
  const distStr=`DIST: ${(state.distance/10).toFixed(1)} km`;
  const shieldStr=`SHIELD: ${Math.round(state.shield)}%`;
  screen.putString(2,1,scoreStr,C.BRIGHT_CYAN,C.BLACK);
  screen.putStringCenter(1,distStr,C.BRIGHT_MAGENTA,C.BLACK);
  screen.putString(w-shieldStr.length-2,1,shieldStr,
    state.shield<30?C.BRIGHT_RED:C.BRIGHT_GREEN,C.BLACK);
  screen.put(0,2,'\u2551',C.CYAN,C.BLACK);
  screen.put(w-1,2,'\u2551',C.CYAN,C.BLACK);
  const barWidth=w-4;
  const barStart=2;
  const filled=floor(barWidth*state.shield/100);
  const barColor=state.shield<30?C.BRIGHT_RED:C.BRIGHT_GREEN;
  for(let i=0;i<barWidth;i++){
    if(i<filled)screen.put(barStart+i,2,'\u2588',barColor,C.BLACK);
    else screen.put(barStart+i,2,'\u2591',C.GRAY,C.BLACK);
  }
  // Combo counter, left-aligned on the row the debug label and the NEW BEST
  // banner centre themselves on, so the three never collide. A lone kill is
  // worth its face value and puts nothing on screen; the chain starts at x2.
  if(state.combo>=2){
    const combo=`COMBO x${state.combo}`;
    const comboColor=state.combo>=6?C.BRIGHT_MAGENTA
      :state.combo>=4?C.BRIGHT_YELLOW
      :C.BRIGHT_CYAN;
    screen.putString(2,HUD_ROWS,combo,comboColor,C.BLACK);
  }

  if(state.debugMode&&state.mode==='playing'){
    const label=`[ DEBUG: ${DEBUG_MODE_NAMES[state.debugMode]} ]`;
    screen.putStringCenter(HUD_ROWS,label,C.BRIGHT_MAGENTA,C.BLACK);
    if(state.debugMode==='obstacleCollision'||state.debugMode==='mineCollision'){
      const tracker=`Collisions: ${state.trackerCount}`;
      screen.putString(w-tracker.length-2,HUD_ROWS,tracker,C.BRIGHT_GREEN,C.BLACK);
    }else if(state.debugMode==='chaos'){
      const tracker=`Destruction: ${state.trackerCount}`;
      screen.putString(w-tracker.length-2,HUD_ROWS,tracker,C.BRIGHT_GREEN,C.BLACK);
    }
  }

  // Warp banner. It shares the centre of this row with the debug label and the
  // NEW BEST banner, and loses to both: a debug run has its label up for the
  // whole run, so the banner is held back rather than blinking over it for two
  // seconds, and NEW BEST is drawn after this and covers it on the rare frame the
  // two coincide. The level counts from 1, so the first one a run ever shows
  // reads WARP LEVEL 2.
  if(state.warpFlash>0&&state.debugMode===null){
    const blink=sin(state.uiTime*8)>0;
    screen.putStringCenter(HUD_ROWS,`>> WARP LEVEL ${state.warpLevel} <<`,
      blink?C.BRIGHT_WHITE:C.BRIGHT_MAGENTA,C.BLACK);
  }

  // NEW BEST banner. It only fires on normal runs, so it never shares this row
  // with the debug label above.
  if(state.newBestFlash>0){
    const blink=sin(state.uiTime*10)>0;
    screen.putStringCenter(HUD_ROWS,'[ NEW BEST ]',blink?C.BRIGHT_YELLOW:C.BRIGHT_WHITE,C.BLACK);
  }
}

function drawFooter(screen,state){
  const w=screen.width,h=screen.height;
  const footerY=h-FOOTER_ROWS;
  screen.put(0,footerY,'\u2560',C.CYAN,C.BLACK);
  screen.hLine(1,footerY,w-2,'\u2550',C.CYAN,C.BLACK);
  screen.put(w-1,footerY,'\u2563',C.CYAN,C.BLACK);
  screen.put(0,footerY+1,'\u255A',C.CYAN,C.BLACK);
  screen.hLine(1,footerY+1,w-2,'\u2550',C.CYAN,C.BLACK);
  screen.put(w-1,footerY+1,'\u255D',C.CYAN,C.BLACK);
  // Fall back to the compact hint list on a narrow viewport so it never runs
  // into the border corners.
  const hintsFull='Arrows:Move  SPACE:Fire  F:Boost  P:Pause  M:Mute  ESC:Quit';
  const hintsShort='Move  Fire  Boost  P:Pause  M:Mute  ESC';
  const hints=hintsFull.length<=w-4?hintsFull:hintsShort;
  const hintX=floor((w-hints.length)/2);
  screen.putString(hintX,footerY,hints,C.GRAY,C.BLACK);

  // Status strip set into the bottom border: speed multiplier and mute state.
  const spd=` SPD: ${(state.speed/BASE_SPEED_START).toFixed(1)}x `;
  screen.putString(2,footerY+1,spd,
    state.boosting?C.BRIGHT_MAGENTA:C.BRIGHT_CYAN,C.BLACK);

  // Active powerups count themselves down beside the speed, which is the other
  // number on this strip that moves while a run is under way. Each badge is drawn
  // only where there is room for it before the mute slot at the right, so the
  // narrowest supported grid drops a badge rather than overwriting the border -
  // the same rule the hint list above follows.
  const muteRoom=state.muted?' MUTED '.length:0;
  let badgeX=2+spd.length;
  for(const badge of powerupBadges(state)){
    if(badgeX+badge.text.length>w-2-muteRoom)break;
    screen.putString(badgeX,footerY+1,badge.text,badge.color,C.BLACK);
    badgeX+=badge.text.length;
  }

  if(state.muted){
    const mute=' MUTED ';
    screen.putString(w-mute.length-2,footerY+1,mute,C.BRIGHT_YELLOW,C.BLACK);
  }
}

// The countdown badges for whatever powerups are running, left to right in a
// fixed order so two of them on screen together do not swap places between
// frames.
//
// Separate from the drawing because it is the whole of what the status strip
// says about a pickup, and a test reading the finished row cannot tell a badge
// dropped for want of room from one the engine never raised.
function powerupBadges(state){
  const out=[];
  if(state.rapidFire>0)out.push({
    text:` ${POWERUP_GLYPHS.rapid.label} ${state.rapidFire.toFixed(1)}s `,
    color:POWERUP_GLYPHS.rapid.bright,
  });
  if(state.slowMotion>0)out.push({
    text:` ${POWERUP_GLYPHS.slow.label} ${state.slowMotion.toFixed(1)}s `,
    color:POWERUP_GLYPHS.slow.bright,
  });
  return out;
}

function drawPauseOverlay(screen,state){
  const w=screen.width,h=screen.height;
  const label='[ PAUSED ]';
  const hint='P to resume';
  const boxW=max(label.length,hint.length)+6;
  const boxX=floor((w-boxW)/2);
  const boxY=floor(h/2)-2;

  screen.fillRect(boxX,boxY,boxW,5,' ',C.WHITE,C.BLACK);
  screen.put(boxX,boxY,'\u250C',C.BRIGHT_CYAN,C.BLACK);
  screen.hLine(boxX+1,boxY,boxW-2,'\u2500',C.BRIGHT_CYAN,C.BLACK);
  screen.put(boxX+boxW-1,boxY,'\u2510',C.BRIGHT_CYAN,C.BLACK);
  screen.vLine(boxX,boxY+1,3,'\u2502',C.BRIGHT_CYAN,C.BLACK);
  screen.vLine(boxX+boxW-1,boxY+1,3,'\u2502',C.BRIGHT_CYAN,C.BLACK);
  screen.put(boxX,boxY+4,'\u2514',C.BRIGHT_CYAN,C.BLACK);
  screen.hLine(boxX+1,boxY+4,boxW-2,'\u2500',C.BRIGHT_CYAN,C.BLACK);
  screen.put(boxX+boxW-1,boxY+4,'\u2518',C.BRIGHT_CYAN,C.BLACK);

  const pulse=sin(state.uiTime*3)*0.5+0.5;
  screen.putStringCenter(boxY+1,label,pulse>0.3?C.BRIGHT_YELLOW:C.YELLOW,C.BLACK);
  screen.putStringCenter(boxY+3,hint,C.GRAY,C.BLACK);
}

function drawEffects(screen,state){
  const w=screen.width,h=screen.height;
  if(state.damageFlash>0.1){
    screen.hLine(1,0,w-2,'\u2550',C.BRIGHT_RED,C.BLACK);
    screen.put(0,0,'\u2554',C.BRIGHT_RED,C.BLACK);
    screen.put(w-1,0,'\u2557',C.BRIGHT_RED,C.BLACK);
  }
  if(state.collectFlash>0.1){
    screen.hLine(1,0,w-2,'\u2550',C.BRIGHT_GREEN,C.BLACK);
    screen.put(0,0,'\u2554',C.BRIGHT_GREEN,C.BLACK);
    screen.put(w-1,0,'\u2557',C.BRIGHT_GREEN,C.BLACK);
  }
  // Speed lines, down both margins. Boosting draws them every third row in
  // magenta; a warp transition draws them every second row, twice as fast and in
  // white, with a second line one column further in. That is what intensifying
  // comes to on a character grid: there is no brightness to turn up, only more of
  // the thing and a hotter colour.
  //
  // A boost through a warp draws the warp's pattern rather than both at once.
  // Laying the two over each other lights so many rows that neither reads as
  // motion any more.
  if(state.boosting||state.warpFlash>0){
    const warping=state.warpFlash>0;
    const step=warping?2:3;
    const rate=warping?60:30;
    const color=warping?C.BRIGHT_WHITE:C.BRIGHT_MAGENTA;
    for(let row=HUD_ROWS+1;row<h-FOOTER_ROWS;row+=step){
      const offset=floor(state.time*rate+row)%5;
      if(offset!==0)continue;
      screen.put(1,row,'\u2502',color,C.BLACK);
      screen.put(w-2,row,'\u2502',color,C.BLACK);
      if(warping){
        screen.put(2,row,'\u2502',C.BRIGHT_MAGENTA,C.BLACK);
        screen.put(w-3,row,'\u2502',C.BRIGHT_MAGENTA,C.BLACK);
      }
    }
  }
}

// ===== Menu Rendering (port of menu.ts) =====

const TITLE_ART=[
  ' ___  ___   _   ___ ___   ___ ___ ___  ___ ___ ',
  '/ __|/ _ \\ / \\ / __| __| | _ \\_ _|   \\| __| _ \\',
  '\\__ \\ ___// _ \\ (_| _|  |   /| || |) | _||   /',
  '|___/|_| /_/ \\_\\___|___| |_|_\\___|___/|___|_|_\\',
];

// One way of laying the debug menu out vertically. The fullest form needs 25
// rows and the documented minimum screen is 20, so the parts that can be given
// up are listed in the order they are given up: the blank row between entries
// first, then the per-mode description, then the title art. The five modes and
// the navigation hint are what the screen is for, and are never dropped.
const DEBUG_MENU_VARIANTS=[
  {art:true,stride:3,desc:true,bracket:true},
