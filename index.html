<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Space Rider</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block}
/* CRT overlay: scanlines and a vignette laid over the canvas rather than drawn
   into the character grid, because it is a property of the screen the game is
   shown on and not of the game. Never under the pointer, and toggled by the
   `crt` class on the body so the whole effect is one class away. */
#crt{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;opacity:0;transition:opacity .15s linear;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.26) 0,rgba(0,0,0,.26) 1px,
      rgba(0,0,0,0) 1px,rgba(0,0,0,0) 3px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);
}
body.crt #crt{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crt"></div>
<script>
// CMD Space Rider — Browser terminal preview
// Faithful port of the CLI game rendered as a canvas-based character grid

const {PI,sin,cos,sqrt,abs,max,min,floor,random,atan2}=Math;
const TAU=PI*2;
const rand=(a=0,b=1)=>a+random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>max(lo,min(hi,v));

// ===== ANSI 256 color palette → hex =====
const ANSI256 = (function(){
  const c = new Array(256);
  // Standard 16 colors (approximate xterm defaults)
  const base16 = [
    '#000000','#aa0000','#00aa00','#aa5500',
    '#0000aa','#aa00aa','#00aaaa','#aaaaaa',
    '#555555','#ff5555','#55ff55','#ffff55',
    '#5555ff','#ff55ff','#55ffff','#ffffff',
  ];
  for(let i=0;i<16;i++) c[i]=base16[i];
  // 216-color cube (indices 16-231)
  const vals=[0,0x5f,0x87,0xaf,0xd7,0xff];
  for(let i=0;i<216;i++){
    const r=vals[floor(i/36)];
    const g=vals[floor(i/6)%6];
    const b=vals[i%6];
    c[16+i]='#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
  }
  // Grayscale ramp (indices 232-255)
  for(let i=0;i<24;i++){
    const v=8+i*10;
    c[232+i]='#'+(v<<16|v<<8|v).toString(16).padStart(6,'0');
  }
  return c;
})();

// Color constants (matching types.ts)
const C={
  BLACK:0,RED:1,GREEN:2,YELLOW:3,BLUE:4,MAGENTA:5,CYAN:6,WHITE:7,
  GRAY:8,BRIGHT_RED:9,BRIGHT_GREEN:10,BRIGHT_YELLOW:11,
  BRIGHT_BLUE:12,BRIGHT_MAGENTA:13,BRIGHT_CYAN:14,BRIGHT_WHITE:15,
  DARK_BLUE:17,DARK_CYAN:23,DARK_GREEN:22,
  NEON_CYAN:51,NEON_GREEN:46,NEON_MAGENTA:201,NEON_RED:196,ORANGE:208,
};

// ===== ScreenBuffer (canvas-backed) =====
class ScreenBuffer{
  constructor(w,h){this.resize(w,h)}
  resize(w,h){
    this.width=w;this.height=h;
    const sz=w*h;
    this.chars=new Array(sz).fill(' ');
    this.fg=new Array(sz).fill(7);
    this.bg=new Array(sz).fill(0);
  }
  clear(bgColor=0){this.chars.fill(' ');this.fg.fill(7);this.bg.fill(bgColor)}
  put(x,y,ch,fgColor=7,bgColor=0){
    x=floor(x);y=floor(y);
    if(x<0||x>=this.width||y<0||y>=this.height)return;
    const i=y*this.width+x;
    this.chars[i]=ch;this.fg[i]=fgColor;this.bg[i]=bgColor;
  }
  putString(x,y,str,fgColor=7,bgColor=0){
    for(let i=0;i<str.length;i++)this.put(x+i,y,str[i],fgColor,bgColor);
  }
  putStringCenter(y,str,fgColor=7,bgColor=0){
    const x=floor((this.width-str.length)/2);
    this.putString(x,y,str,fgColor,bgColor);
  }
  fillRect(x,y,w,h,ch,fgColor,bgColor){
    for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)this.put(x+dx,y+dy,ch,fgColor,bgColor);
  }
  hLine(x,y,len,ch,fgColor,bgColor=0){
    for(let i=0;i<len;i++)this.put(x+i,y,ch,fgColor,bgColor);
  }
  vLine(x,y,len,ch,fgColor,bgColor=0){
    for(let i=0;i<len;i++)this.put(x,y+i,ch,fgColor,bgColor);
  }
  render(ctx,cellW,cellH,font){
    ctx.textBaseline='top';
    ctx.font=font;
    for(let y=0;y<this.height;y++){
      for(let x=0;x<this.width;x++){
        const i=y*this.width+x;
        const px=x*cellW;
        const py=y*cellH;
        // Background
        const bgHex=ANSI256[this.bg[i]]||'#000000';
        if(this.bg[i]!==0){
          ctx.fillStyle=bgHex;
          ctx.fillRect(px,py,cellW+1,cellH+1);
        }
        // Character
        const ch=this.chars[i];
        if(ch!==' '){
          ctx.fillStyle=ANSI256[this.fg[i]]||'#aaaaaa';
          ctx.fillText(ch,px,py);
        }
      }
    }
  }
}

// ===== Game Constants =====
const NUM_RINGS=30;
const RECYCLE_Z=NUM_RINGS*14;
const HUD_ROWS=3;
const FOOTER_ROWS=2;
const Y_FACTOR=0.4;
const SHIP_HALF_W=1;
const SHIP_HALF_H=1;

// Speed a run starts at. The HUD speed readout is a multiple of this.
const BASE_SPEED_START=0.3;
// Seconds the screen shake lasts after the ship takes damage.
const SHAKE_TIME=0.2;
// Seconds the "NEW BEST" HUD banner stays on screen.
const NEW_BEST_FLASH_TIME=2;
// Peak canvas offset of the damage shake, in pixels.
const SHAKE_PIXELS=5;
// Seconds a barrel roll takes to carry the ship all the way round.
const ROLL_TIME=0.5;
// Seconds from the start of one barrel roll to the earliest next one. Longer
// than the roll itself, so there is a beat of level flight between two of them
// and the invincibility the roll grants cannot be held open indefinitely.
const ROLL_COOLDOWN=1.2;
// Columns of slack the pulse cannon's hit test allows either side of a target's
// drawn block.
//
// Past about 47 units out a target's block is a single character, so without
// slack a shot has to land on one exact column. Two things go wrong with that.
// Both positions are floored to a cell, so a shot dead on in world terms still
// reads as one column adrift whenever the two fall either side of a cell
// boundary. And a target's own column creeps outward while the shot is in
// flight, which over a long one comes to about a column of lead the player has
// no way to measure.
//
// One column covers both: the shot registers where it passes through the
// target's block or immediately beside it. Two was measured as well and buys
// little past what the three-shot volley's own spread already covers, at the
// cost of counting a shot that visibly clears the target by a character.
const SHOT_SLACK_COLS=1;
// Seconds a combo chain survives without a kill before it drops to nothing.
const COMBO_TIME=2;
// The highest multiplier a chain can reach. Without a ceiling the chain barely
// ever breaks - obstacle density rises with difficulty, so two seconds is longer
// than the gap between kills - and an ordinary run runs into the millions while a
// best score set by one long chain is one ordinary play can never approach again.
// The counter reads the cap rather than counting past it, so the number on the
// HUD is always the multiplier actually being paid. Eight clears the top HUD
// colour tier at 6, so every tier is still reachable, and holds a mine kill at
// 4000 rather than the 68,600 the 343rd kill of an uncapped chain was worth.
const COMBO_MAX=8;

// ===== Best score persistence =====
// localStorage throws rather than returning null in some privacy modes and
// file:// sandboxes, so every access is guarded and falls back to no history.
const BEST_SCORE_KEY='cmdSpaceRider.bestScore';

function loadBestScore(){
  try{
    const raw=localStorage.getItem(BEST_SCORE_KEY);
    if(raw===null)return 0;
    const n=parseInt(raw,10);
    return Number.isFinite(n)&&n>0?n:0;
  }catch(e){
    return 0;
  }
}

function saveBestScore(best){
  try{
    localStorage.setItem(BEST_SCORE_KEY,String(best));
  }catch(e){
    /* score stays for this session only */
  }
}

// ===== CRT overlay preference =====
// The overlay is on out of the box - the retro screen is the look the game is
// after - so anything other than a stored 'off' reads as on, and a browser that
// will not hand over its storage still gets the default rather than an error.
const CRT_KEY='cmdSpaceRider.crt';

function loadCrt(){
  try{
    return localStorage.getItem(CRT_KEY)!=='off';
  }catch(e){
    return true;
  }
}

function saveCrt(on){
  try{
    localStorage.setItem(CRT_KEY,on?'on':'off');
  }catch(e){
    /* the choice stays for this session only */
  }
}

const DEBUG_MODES=['mines','orbs','obstacleCollision','mineCollision','chaos'];
const DEBUG_MODE_NAMES={
  mines:'MINE FIELD',orbs:'ORB HARVEST',
  obstacleCollision:'COLLISION COURSE',mineCollision:'MINE SWEEPER',chaos:'CHAOS PROTOCOL',
};
const DEBUG_MODE_DESCS={
  mines:'Only mines. Pure evasion.',orbs:'Only orbs. Collect them all.',
  obstacleCollision:'Hit obstacles. Track every impact.',
  mineCollision:'Ram mines. Log collisions.',chaos:'Everything. Everywhere. All at once.',
};

// ===== Game Engine (port of game.ts) =====
class Game{
  constructor(){this.state=this.createInitialState()}
  createInitialState(){
    return{
      mode:'menu',debugMode:null,score:0,distance:0,shield:100,
      bestScore:loadBestScore(),
      speed:BASE_SPEED_START,baseSpeed:BASE_SPEED_START,boostSpeed:0.55,
      shipX:0,shipY:0,shipRoll:0,rollDir:0,rollCooldown:0,
      time:0,uiTime:0,gameTime:0,
      obstacles:[],orbs:[],mines:[],bullets:[],particles:[],stars:[],
      tunnelRadius:8,maxViewZ:200,
      lastObstacleIncreaseMinute:0,mineTrackTime:0,minesToPresent:0,
      mineSpawnTimers:[],firstMinuteElapsed:false,
      trackerCount:0,debugMenuSelected:0,chaosFireTimer:0,
      damageFlash:0,collectFlash:0,boosting:false,
      combo:0,comboTimer:0,sounds:[],
      paused:false,muted:false,shake:0,newBestFlash:0,newBestShown:false,
      screenWidth:80,screenHeight:24,
    };
  }
  // The perspective scale toScreen applies at a given depth, on its own. The
  // pulse cannon needs it away from a full projection: a shot holds the screen
  // column it was fired down, and that means undoing the scale rather than
  // applying it.
  projScale(gz){
    const s=this.state;
    const t=max(0,min(1,(gz+s.maxViewZ)/s.maxViewZ));
    return 0.15+t*0.85;
  }
  toScreen(gx,gy,gz){
    const s=this.state;
    const sw=s.screenWidth,sh=s.screenHeight;
    const gameTop=HUD_ROWS;
    const gameBottom=sh-FOOTER_ROWS;
    const gameH=gameBottom-gameTop;
    const t=max(0,min(1,(gz+s.maxViewZ)/s.maxViewZ));
    const scale=this.projScale(gz);
    const baseRow=gameTop+t*(gameH-2);
    const colRange=(sw-6)/2;
    const col=sw/2+(gx/s.tunnelRadius)*colRange*scale;
    const rowOffset=-(gy/s.tunnelRadius)*gameH*Y_FACTOR*scale;
    const row=baseRow+rowOffset;
    return{col:floor(col),row:floor(row),scale};
  }
  initStars(w,h){
    this.state.stars=[];
    const starChars=['.','\u00B7','*','+'];
    const starColors=[8,7,15,8,7];
    for(let i=0;i<40;i++){
      this.state.stars.push({
        x:floor(random()*w),y:floor(random()*h),
        speed:rand(0.3,1.5),
        char:starChars[floor(random()*starChars.length)],
        color:starColors[floor(random()*starColors.length)],
      });
    }
  }
  showDebugMenu(){this.state.mode='debugMenu';this.state.debugMenuSelected=0}
  startGame(mode){
    const s=this.state;
    s.debugMode=mode||null;s.mode='playing';
    s.score=0;s.distance=0;s.shield=100;
    s.baseSpeed=BASE_SPEED_START;s.boostSpeed=0.55;s.speed=s.baseSpeed;
    s.shipX=0;s.shipY=1;s.shipRoll=0;s.rollDir=0;s.rollCooldown=0;
    s.combo=0;s.comboTimer=0;
    s.obstacles=[];s.orbs=[];s.bullets=[];s.particles=[];s.mines=[];
    s.gameTime=0;s.lastObstacleIncreaseMinute=0;
    s.mineTrackTime=0;s.minesToPresent=0;s.mineSpawnTimers=[];
    s.firstMinuteElapsed=false;s.trackerCount=0;s.chaosFireTimer=0;
    s.damageFlash=0;s.collectFlash=0;s.boosting=false;
    s.paused=false;s.shake=0;s.newBestFlash=0;s.newBestShown=false;

    if(s.debugMode==='mines'){
      for(let i=0;i<40;i++)this.spawnMine(-i*10-30);
    }else if(s.debugMode==='orbs'){
      for(let i=0;i<100;i++)this.spawnOrb(-i*8-15);
    }else if(s.debugMode==='obstacleCollision'){
      for(let i=0;i<60;i++)this.spawnObstacle(-i*14-30);
    }else if(s.debugMode==='mineCollision'){
      for(let i=0;i<40;i++)this.spawnMine(-i*10-30);
    }else if(s.debugMode==='chaos'){
      for(let i=0;i<120;i++)this.spawnObstacle(-i*7-20);
      for(let i=0;i<50;i++)this.spawnOrb(-i*10-15);
      for(let i=0;i<25;i++)this.spawnMine(-i*12-30);
    }else{
      for(let i=0;i<60;i++){
        this.spawnObstacle(-i*14-30);
        if(random()<0.4)this.spawnOrb(-i*14-20);
      }
    }
  }
  endGame(){
    const s=this.state;
    s.mode='dead';
    // Debug scenarios are diagnostics rather than scored runs, so they never
    // set the best score. Only a normal run can beat it.
    if(s.debugMode===null&&s.score>s.bestScore){
      s.bestScore=s.score;
      saveBestScore(s.bestScore);
    }
  }
  spawnObstacle(z){
    this.state.obstacles.push({
      x:rand(-4.5,4.5),y:rand(0.5,4.5),z,
      rot:rand(0,TAU),rotSpeed:rand(-2,2),scale:rand(0.6,1.5),
    });
  }
  spawnOrb(z){
    this.state.orbs.push({x:rand(-4.5,4.5),y:rand(0.5,4.5),z,collected:false});
  }
  spawnMine(z){
    this.state.mines.push({
      x:rand(-4.5,4.5),y:rand(0.5,4.5),z,
      rot:rand(0,TAU),rotSpeed:rand(-2,2),scale:rand(0.66,1.65),hp:5,
    });
  }
  spawnParticles(x,y,z,color,count){
    for(let i=0;i<count;i++){
      this.state.particles.push({
        x,y,z,vx:rand(-3,3),vy:rand(-3,3),vz:rand(-1,2),
        life:rand(0.3,0.8),maxLife:0.8,color,
      });
    }
  }
  handleMenuInput(justPressed){
    const s=this.state;
    if(s.mode==='menu'||s.mode==='dead'){
      if(justPressed.ENTER)this.startGame();
    }
    if(s.mode==='debugMenu'){
      if(justPressed.UP)s.debugMenuSelected=(s.debugMenuSelected-1+DEBUG_MODES.length)%DEBUG_MODES.length;
      if(justPressed.DOWN)s.debugMenuSelected=(s.debugMenuSelected+1)%DEBUG_MODES.length;
      if(justPressed.ENTER)this.startGame(DEBUG_MODES[s.debugMenuSelected]);
      for(let i=0;i<5;i++){
        if(justPressed['DIGIT_'+(i+1)])this.startGame(DEBUG_MODES[i]);
      }
    }
  }
  // Queue a one-shot sound for the frame being simulated. The queue is drained
  // by whoever can make a noise with it, which is the browser build alone.
  cue(name){this.state.sounds.push(name)}
  // Count a kill into the combo chain and hand back the multiplier it earns.
  // The first kill is worth x1, and each further one inside the window raises
  // it, so a chain pays more the faster it is strung together, up to COMBO_MAX.
  // A kill at the ceiling still re-arms the window, so the chain is held rather
  // than broken by pressing on past it.
  registerKill(){
    const s=this.state;
    s.combo=min(s.combo+1,COMBO_MAX);
    s.comboTimer=COMBO_TIME;
    return s.combo;
  }
  update(dt,keys,justPressed){
    const s=this.state;

    // The cue queue holds one frame's worth of sound. Emptying it here rather
    // than leaving it to the caller keeps it bounded in a build that never
    // reads it.
    s.sounds.length=0;

    // M is a global setting toggle, so it works in every mode. P only pauses a
    // run in progress.
    if(justPressed.M)s.muted=!s.muted;
    if(s.mode==='playing'&&justPressed.P)s.paused=!s.paused;

    // Presentation timers keep running while paused so an in-flight flash or
    // shake finishes instead of freezing on screen.
    s.uiTime+=dt;
    // The world's clock stops with the world, so a paused screen is a still
    // image. The gate names the mode as well as the flag: the title screen,
    // debug menu and game over screen animate off this clock and are not a
    // run in progress, so a bare `!s.paused` would freeze them too.
    if(!(s.mode==='playing'&&s.paused))s.time+=dt;
    s.damageFlash=max(0,s.damageFlash-dt*8);
    s.collectFlash=max(0,s.collectFlash-dt*8);
    s.newBestFlash=max(0,s.newBestFlash-dt);
    s.shake=max(0,s.shake-dt);

    if(s.mode==='playing'&&!s.paused)this.updatePlaying(dt,keys,justPressed);
  }
  updatePlaying(dt,keys,justPressed){
    const s=this.state;
    const moveSpeed=8;
    if(keys.A||keys.LEFT){s.shipX-=moveSpeed*dt}
    if(keys.D||keys.RIGHT){s.shipX+=moveSpeed*dt}
    if(keys.W||keys.UP){s.shipY+=moveSpeed*dt}
    if(keys.S||keys.DOWN){s.shipY-=moveSpeed*dt}

    this.updateBarrelRoll(dt,justPressed);
    this.updateCombo(dt);

    s.boosting=false;
    if(s.debugMode==='chaos'){
      s.speed=lerp(s.speed,s.boostSpeed,3*dt);s.boosting=true;
    }else if(keys.F||keys.SHIFT){
      s.speed=lerp(s.speed,s.boostSpeed,3*dt);s.boosting=true;
    }else{
      s.speed=lerp(s.speed,s.baseSpeed,2*dt);
    }

    const maxR=s.tunnelRadius-1.5;
    s.shipX=max(-maxR,min(maxR,s.shipX));
    s.shipY=max(0,min(maxR,s.shipY));

    if(justPressed.SPACE){
      s.bullets.push({x:s.shipX,y:s.shipY,z:-2,life:2});
      s.bullets.push({x:s.shipX-0.25,y:s.shipY-0.05,z:-1.5,life:2});
      s.bullets.push({x:s.shipX+0.25,y:s.shipY-0.05,z:-1.5,life:2});
      this.cue('shot');
    }

    if(s.debugMode==='chaos'){
      s.chaosFireTimer+=dt;
      if(s.chaosFireTimer>=0.12){
        s.chaosFireTimer=0;
        s.bullets.push({x:s.shipX,y:s.shipY,z:-2,life:2});
        s.bullets.push({x:s.shipX-0.25,y:s.shipY-0.05,z:-1.5,life:2});
        s.bullets.push({x:s.shipX+0.25,y:s.shipY-0.05,z:-1.5,life:2});
        this.cue('shot');
      }
    }

    const advance=s.speed*60*dt;
    s.distance+=advance;

    if(s.debugMode!=='obstacleCollision'&&s.debugMode!=='mineCollision'){
      s.score+=floor(advance*10*(s.speed/s.baseSpeed));
    }

    // First crossing of the stored best in a normal run raises the HUD banner.
    // A best of 0 means there is nothing to beat yet, so the first run is quiet.
    if(s.debugMode===null&&!s.newBestShown&&s.bestScore>0&&s.score>s.bestScore){
      s.newBestShown=true;
      s.newBestFlash=NEW_BEST_FLASH_TIME;
    }

    s.baseSpeed=BASE_SPEED_START+s.distance*0.00002;
    s.boostSpeed=s.baseSpeed*1.8;
    s.gameTime+=dt;

    this.updateObstacleScaling();
    this.updateMineSpawning(dt);
    this.updateObstacles(advance,dt);
    this.updateOrbs(advance);
    this.updateMines(advance,dt);
    this.updateBullets(dt,advance);
    this.updateParticles(dt,advance);
    this.updateStars(dt);
  }
  // Barrel roll. Q rolls left and E rolls right, for as long as ROLL_TIME, and
  // the ship is untouchable for the whole of it - that dodge is what the move
  // is for. The cooldown starts with the roll rather than with its end, so it
  // bounds how much of a run can be spent invincible.
  updateBarrelRoll(dt,justPressed){
    const s=this.state;
    if(s.rollCooldown>0)s.rollCooldown=max(0,s.rollCooldown-dt);

    if(s.shipRoll>0){
      s.shipRoll=max(0,s.shipRoll-dt);
      if(s.shipRoll===0)s.rollDir=0;
      return;
    }

    if(s.rollCooldown>0)return;
    const dir=justPressed.Q?-1:justPressed.E?1:0;
    if(dir===0)return;

    s.shipRoll=ROLL_TIME;
    s.rollDir=dir;
    s.rollCooldown=ROLL_COOLDOWN;
  }
  // True while a barrel roll is carrying the ship through whatever it hits.
  invincible(){return this.state.shipRoll>0}
  // Combo decay. Every kill re-arms the window in registerKill; COMBO_TIME
  // without one drops the chain, so the multiplier only pays for kills strung
  // together rather than for a long run's total.
  updateCombo(dt){
    const s=this.state;
    if(s.comboTimer<=0)return;
    s.comboTimer=max(0,s.comboTimer-dt);
    if(s.comboTimer===0)s.combo=0;
  }
  updateObstacleScaling(){
    const s=this.state;
    if(!s.debugMode||s.debugMode==='obstacleCollision'||s.debugMode==='chaos'){
      const currentMinute=floor(s.gameTime/60);
      if(currentMinute>s.lastObstacleIncreaseMinute){
        const newCount=Math.ceil(s.obstacles.length*0.1);
        for(let i=0;i<newCount;i++)this.spawnObstacle(-rand(30,RECYCLE_Z));
        s.lastObstacleIncreaseMinute=currentMinute;
      }
    }
  }
  updateMineSpawning(dt){
    const s=this.state;
    if(s.debugMode&&s.debugMode!=='mines'&&s.debugMode!=='mineCollision'&&s.debugMode!=='chaos')return;
    if(s.debugMode==='mines'||s.debugMode==='mineCollision'||s.debugMode==='chaos'){
      s.mineTrackTime+=dt;
      if(s.mineTrackTime>=5){
        s.mineTrackTime=0;
        const count=s.debugMode==='chaos'?3:2;
        for(let i=0;i<count;i++)this.spawnMine(-rand(30,60));
      }
    }else{
      s.mineTrackTime+=dt;
      if(!s.firstMinuteElapsed){
        if(s.mineTrackTime>=60){
          s.firstMinuteElapsed=true;s.mineTrackTime=0;
          s.minesToPresent+=1;s.mineSpawnTimers=[];
          for(let i=0;i<s.minesToPresent;i++)s.mineSpawnTimers.push(floor(30*random()));
        }
      }else{
        if(s.mineTrackTime>=30){
          s.mineTrackTime=0;s.minesToPresent+=1;s.mineSpawnTimers=[];
          for(let i=0;i<s.minesToPresent;i++)s.mineSpawnTimers.push(floor(30*random()));
        }
        for(let i=s.mineSpawnTimers.length-1;i>=0;i--){
          if(s.mineTrackTime>=s.mineSpawnTimers[i]){
            this.spawnMine(-rand(30,60));s.mineSpawnTimers.splice(i,1);
          }
        }
      }
    }
  }
  updateObstacles(advance,dt){
    const s=this.state;
    if(s.debugMode&&s.debugMode!=='obstacleCollision'&&s.debugMode!=='chaos')return;
    const shipScr=this.toScreen(s.shipX,s.shipY,0);
    for(let i=s.obstacles.length-1;i>=0;i--){
      const o=s.obstacles[i];
      o.z+=advance;o.rot+=o.rotSpeed*dt;
      if(o.z>10){o.z-=RECYCLE_Z;o.x=rand(-4.5,4.5);o.y=rand(0.5,4.5);o.scale=rand(0.6,1.5)}
      if(o.z>-20&&o.z<5){
        const oScr=this.toScreen(o.x,o.y,o.z);
        const size=max(1,floor(oScr.scale*2.5));
        const half=floor(size/2);
        const dy=shipScr.row-oScr.row;
        if(abs(shipScr.col-oScr.col)<=SHIP_HALF_W+half&&
           dy<=2+half&&dy>=-(1+half)){
          if(this.invincible())continue; // rolled clean through it
          s.shake=SHAKE_TIME; // every branch below is an impact
          this.cue('damage');
          if(s.debugMode==='obstacleCollision'){
            s.trackerCount++;s.damageFlash=0.5;
            this.spawnParticles(o.x,o.y,o.z,208,8);
            o.z=-RECYCLE_Z+rand(-10,10);
          }else if(s.debugMode==='chaos'){
            s.damageFlash=0.3;this.spawnParticles(o.x,o.y,o.z,208,8);
            o.z=-RECYCLE_Z+rand(-10,10);
          }else{
            s.shield-=25;s.damageFlash=0.8;
            this.spawnParticles(o.x,o.y,o.z,9,8);
            o.z=-RECYCLE_Z+rand(-10,10);
            if(s.shield<=0){s.shield=0;this.endGame();return}
          }
        }
      }
    }
  }
  updateOrbs(advance){
    const s=this.state;
    if(s.debugMode&&s.debugMode!=='orbs'&&s.debugMode!=='chaos')return;
    const shipScr=this.toScreen(s.shipX,s.shipY,0);
    for(let i=s.orbs.length-1;i>=0;i--){
      const o=s.orbs[i];
      o.z+=advance;
      if(o.z>10){o.z-=RECYCLE_Z;o.x=rand(-4.5,4.5);o.y=rand(0.5,4.5);o.collected=false}
      if(!o.collected&&o.z>-20&&o.z<5){
        const oScr=this.toScreen(o.x,o.y,o.z);
        const size=max(1,floor(oScr.scale*2));
        const half=floor(size/2);
        const dy=shipScr.row-oScr.row;
        if(abs(shipScr.col-oScr.col)<=SHIP_HALF_W+half&&
           dy<=2+half&&dy>=-(1+half)){
          o.collected=true;s.score+=500;
          s.shield=min(100,s.shield+10);s.collectFlash=0.6;
          this.cue('orb');
          this.spawnParticles(o.x,o.y,o.z,10,10);
        }
      }
    }
  }
  updateMines(advance,dt){
    const s=this.state;
    if(s.debugMode&&s.debugMode!=='mines'&&s.debugMode!=='mineCollision'&&s.debugMode!=='chaos')return;
    const shipScr=this.toScreen(s.shipX,s.shipY,0);
    for(let i=s.mines.length-1;i>=0;i--){
      const m=s.mines[i];
      m.z+=advance;m.rot+=m.rotSpeed*dt;
      if(m.z>10){
        if(s.debugMode==='mines'||s.debugMode==='mineCollision'){
          m.z=-rand(30,60);m.x=rand(-4.5,4.5);m.y=rand(0.5,4.5);m.hp=5;continue;
        }
        s.mines.splice(i,1);continue;
      }
      if(m.z>-20&&m.z<5){
        const mScr=this.toScreen(m.x,m.y,m.z);
        const size=max(1,floor(mScr.scale*2.5));
        const half=floor(size/2);
        const dy=shipScr.row-mScr.row;
        if(abs(shipScr.col-mScr.col)<=SHIP_HALF_W+half&&
           dy<=2+half&&dy>=-(1+half)){
          if(this.invincible())continue; // rolled clean through it
          s.shake=SHAKE_TIME; // every branch below is an impact
          this.cue('damage');
          if(s.debugMode==='mineCollision'){
            s.trackerCount++;s.damageFlash=0.5;
            this.spawnParticles(m.x,m.y,m.z,9,8);
            m.z=-rand(30,60);m.x=rand(-4.5,4.5);m.y=rand(0.5,4.5);m.hp=5;
          }else if(s.debugMode==='chaos'){
            s.damageFlash=0.5;this.spawnParticles(m.x,m.y,m.z,9,15);
            s.mines.splice(i,1);
          }else{
            s.shield-=35;s.damageFlash=1.0;
            this.spawnParticles(m.x,m.y,m.z,9,15);s.mines.splice(i,1);
            if(s.shield<=0){s.shield=0;this.endGame();return}
          }
        }
      }
    }
  }
  // How far into the frame just stepped a shot crossed an entity's depth, as a
  // fraction of that step, or null when it did not cross it. Both ends move -
  // the shot outward by its travel, the entity inward by `advance` - so the gap
  // between them only ever closes and there is at most one crossing per frame.
  // `entityZ` is where the entity finished the frame, so subtracting `advance`
  // is where it started it.
  crossing(fromZ,toZ,entityZ,advance){
    const gapBefore=fromZ-(entityZ-advance);
    const gapAfter=toZ-entityZ;
    if(gapBefore<0||gapAfter>0)return null;
    const closed=gapBefore-gapAfter;
    return closed<=0?0:gapBefore/closed;
  }
  // Bullet flight and what it hits.
  //
  // Horizontally a shot holds the screen column it was fired down rather than a
  // line of constant world x, because the column is the player's whole aim: the
  // target is one glyph in one of about seventy columns, the ship is another,
  // and there is no reticle to do it any other way. A world-space shot
  // converges on the vanishing point as it recedes while the target it was
  // aimed at diverges from it, so a shot lined up at the muzzle lands wide of
  // anything off-centre, and the wider the range the wider it lands. Paying
  // `b.x` forward by the ratio of the two scales holds the column instead, and
  // the shot then draws as the straight line up the screen a player already
  // reads it as.
  //
  // Vertically it stays in world space, because that axis reads differently.
  // Y_FACTOR squashes the tunnel's whole height into about eight rows at the
  // muzzle, so nobody aims by row - they aim by how high in the tunnel the
  // target sits, which is world y. Holding the row instead measured worse at
  // every range, since it puts the shot above a target the player had lined up
  // correctly.
  //
  // The hit is then resolved at the depth where the shot crossed the target
  // rather than wherever the frame happened to leave it, so both are projected
  // on one plane and the comparison holds at any frame rate.
  updateBullets(dt,advance){
    const s=this.state;
    const travel=60*dt;
    for(let i=s.bullets.length-1;i>=0;i--){
      const b=s.bullets[i];
      const fromZ=b.z;
      b.z-=travel;b.life-=dt;
      if(b.life<=0){s.bullets.splice(i,1);continue}
      // x * scale is constant along a screen ray, so carrying x forward by the
      // ratio of the two scales holds the column the shot was fired at.
      b.x*=this.projScale(fromZ)/this.projScale(b.z);
      const aimX=b.x*this.projScale(b.z);
      let hit=false;
      if(!s.debugMode||s.debugMode==='obstacleCollision'||s.debugMode==='chaos'){
        for(let j=s.obstacles.length-1;j>=0;j--){
          const o=s.obstacles[j];
          const u=this.crossing(fromZ,b.z,o.z,advance);
          if(u===null)continue;
          const hitZ=fromZ-u*travel;
          const scale=this.projScale(hitZ);
          const bScr=this.toScreen(aimX/scale,b.y,hitZ);
          const oScr=this.toScreen(o.x,o.y,hitZ);
          const size=max(1,floor(scale*2.5));
          const half=floor(size/2);
          if(abs(bScr.col-oScr.col)<=half+SHOT_SLACK_COLS&&
             bScr.row>=oScr.row-half&&bScr.row-1<=oScr.row+half){
            this.spawnParticles(o.x,o.y,o.z,208,12);
            if(s.debugMode==='chaos')s.trackerCount++;
            // The collision-tracking modes are not scored, so a kill in one of
            // them carries no multiplier and never starts a chain either.
            if(s.debugMode!=='obstacleCollision'&&s.debugMode!=='mineCollision')
              s.score+=200*this.registerKill();
            o.z=-RECYCLE_Z+rand(-10,10);
            s.bullets.splice(i,1);hit=true;break;
          }
        }
      }
      if(hit)continue;
      if(!s.debugMode||s.debugMode==='mines'||s.debugMode==='mineCollision'||s.debugMode==='chaos'){
        for(let j=s.mines.length-1;j>=0;j--){
          const m=s.mines[j];
          const u=this.crossing(fromZ,b.z,m.z,advance);
          if(u===null)continue;
          const hitZ=fromZ-u*travel;
          const scale=this.projScale(hitZ);
          const bScr=this.toScreen(aimX/scale,b.y,hitZ);
          const mScr=this.toScreen(m.x,m.y,hitZ);
          const size=max(1,floor(scale*2.5));
          const half=floor(size/2);
          if(abs(bScr.col-mScr.col)<=half+SHOT_SLACK_COLS&&
             bScr.row>=mScr.row-half&&bScr.row-1<=mScr.row+half){
            m.hp-=1;this.spawnParticles(m.x,m.y,m.z,9,5);
            if(m.hp<=0){
              this.spawnParticles(m.x,m.y,m.z,9,20);
              this.cue('mine');
              if(s.debugMode==='chaos')s.trackerCount++;
              if(s.debugMode!=='obstacleCollision'&&s.debugMode!=='mineCollision')
                s.score+=500*this.registerKill();
              s.mines.splice(j,1);
            }
            s.bullets.splice(i,1);break;
          }
        }
      }
    }
  }
  updateParticles(dt,advance){
    const s=this.state;
    for(let i=s.particles.length-1;i>=0;i--){
      const p=s.particles[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=(p.vz+advance)*dt;
      p.life-=dt;
      if(p.life<=0)s.particles.splice(i,1);
    }
  }
  updateStars(dt){
    const s=this.state;
    const speedMul=s.speed/s.baseSpeed;
    for(const star of s.stars)star.y+=star.speed*speedMul*dt*30;
  }
}

// ===== Rendering (port of render.ts) =====

function gameToScreen(gx,gy,gz,sw,sh,gameTop,gameBottom,tunnelRadius,maxZ){
  const gameH=gameBottom-gameTop;
  const t=clamp((gz+maxZ)/maxZ,0,1);
  const scale=0.15+t*0.85;
  const baseRow=gameTop+t*(gameH-2);
  const colRange=(sw-6)/2;
  const col=sw/2+(gx/tunnelRadius)*colRange*scale;
  const rowOffset=-(gy/tunnelRadius)*(gameH*0.4)*scale;
  const row=baseRow+rowOffset;
  return{col:floor(col),row:floor(row),scale};
}

function renderGame(screen,state){
  const w=screen.width,h=screen.height;
  const gameTop=HUD_ROWS,gameBottom=h-FOOTER_ROWS;
  screen.clear(C.BLACK);
  drawStarfield(screen,state,gameTop,gameBottom);
  drawTunnel(screen,state,gameTop,gameBottom);
  drawEntitiesFar(screen,state,gameTop,gameBottom);
  drawBullets(screen,state,gameTop,gameBottom);
  drawParticles(screen,state,gameTop,gameBottom);
  drawShip(screen,state,gameTop,gameBottom);
  drawHUD(screen,state);
  drawFooter(screen,state);
  drawEffects(screen,state);
  // The damage shake is a canvas offset applied in frame(), not a grid change,
  // so the character buffer itself needs nothing here.
  if(state.paused)drawPauseOverlay(screen,state);
}

/**
 * Damage screen shake as a canvas pixel offset, fading with the shake timer.
 * Returns the {x,y} translation to apply before drawing the character grid.
 */
function shakeOffset(state){
  if(state.shake<=0)return{x:0,y:0};
  const strength=state.shake/SHAKE_TIME;
  return{
    x:sin(state.uiTime*90)*SHAKE_PIXELS*strength,
    y:cos(state.uiTime*70)*SHAKE_PIXELS*0.8*strength,
  };
}

function drawStarfield(screen,state,gameTop,gameBottom){
  const h=screen.height,w=screen.width;
  for(const star of state.stars){
    const sy=star.y%h;
    const y=sy<0?sy+h:sy;
    if(y>=gameTop&&y<gameBottom){
      screen.put(floor(star.x)%w,floor(y),star.char,star.color,C.BLACK);
    }
  }
}

function drawTunnel(screen,state,gameTop,gameBottom){
  const w=screen.width;
  const gameH=gameBottom-gameTop;
  const center=floor(w/2);
  const ringSpacing=4;
  const ringOffset=floor(state.distance*0.3)%ringSpacing;
  for(let row=gameTop;row<gameBottom;row++){
    const t=(row-gameTop)/gameH;
    const halfSpan=floor(3+t*(center-4));
    const leftWall=center-halfSpan;
    const rightWall=center+halfSpan;
    const thickness=max(1,floor(t*3));
    let wallChar,wallColor;
    const pulse=sin(state.time*3+row*0.15)*0.3+0.7;
    if(t<0.2){wallChar='\u2591';wallColor=pulse>0.6?C.DARK_BLUE:C.BLUE}
    else if(t<0.5){wallChar='\u2592';wallColor=pulse>0.6?C.BLUE:C.BRIGHT_BLUE}
    else if(t<0.8){wallChar='\u2593';wallColor=pulse>0.6?C.BRIGHT_BLUE:C.CYAN}
    else{wallChar='\u2588';wallColor=pulse>0.6?C.CYAN:C.BRIGHT_CYAN}
    for(let dx=0;dx<thickness;dx++){
      screen.put(leftWall-dx,row,wallChar,wallColor,C.BLACK);
      screen.put(rightWall+dx,row,wallChar,wallColor,C.BLACK);
    }
    const isRing=(row-gameTop+ringOffset)%ringSpacing===0;
    if(isRing&&t>0.1){
      const ringColor=t>0.5?C.BRIGHT_CYAN:C.CYAN;
      screen.put(leftWall,row,'\u2563',ringColor,C.BLACK);
      screen.put(rightWall,row,'\u2560',ringColor,C.BLACK);
      if(t>0.3){
        for(let x=leftWall+2;x<rightWall;x+=4)
          screen.put(x,row,'\u00B7',C.DARK_BLUE,C.BLACK);
      }
    }
  }
}

function drawEntitiesFar(screen,state,gameTop,gameBottom){
  const w=screen.width,h=screen.height;
  for(const o of state.obstacles){
    if(o.z<-state.maxViewZ||o.z>5)continue;
    const pos=gameToScreen(o.x,o.y,o.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row<gameTop||pos.row>=gameBottom)continue;
    const size=max(1,floor(pos.scale*2.5));
    const glow=sin(state.time*3+o.z)*0.3+0.5;
    const color=glow>0.5?C.BRIGHT_RED:C.RED;
    const ch=size>=2?'\u2593':'\u25A0';
    drawBlock(screen,pos.col,pos.row,size,ch,color,gameTop,gameBottom);
  }
  for(const m of state.mines){
    if(m.z<-state.maxViewZ||m.z>5)continue;
    const pos=gameToScreen(m.x,m.y,m.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row<gameTop||pos.row>=gameBottom)continue;
    const size=max(1,floor(pos.scale*2.5));
    const blink=sin(state.time*8)>0;
    const color=blink?C.BRIGHT_RED:C.GRAY;
    const ch=blink?'\u25C8':'\u25A0';
    drawBlock(screen,pos.col,pos.row,size,ch,color,gameTop,gameBottom);
  }
  for(const o of state.orbs){
    if(o.collected||o.z<-state.maxViewZ||o.z>5)continue;
    const pos=gameToScreen(o.x,o.y+sin(state.time*4+o.x)*0.3,o.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row<gameTop||pos.row>=gameBottom)continue;
    const size=max(1,floor(pos.scale*2));
    const pulse=sin(state.time*5)*0.3+0.7;
    const color=pulse>0.6?C.BRIGHT_GREEN:C.GREEN;
    const ch=size>=2?'\u25C6':'\u2666';
    drawBlock(screen,pos.col,pos.row,size,ch,color,gameTop,gameBottom);
  }
}

function drawBlock(screen,cx,cy,size,ch,color,gameTop,gameBottom){
  const half=floor(size/2);
  for(let dy=-half;dy<=half;dy++){
    for(let dx=-half;dx<=half;dx++){
      const y=cy+dy;
      if(y>=gameTop&&y<gameBottom)screen.put(cx+dx,y,ch,color,C.BLACK);
    }
  }
}

function drawBullets(screen,state,gameTop,gameBottom){
  const w=screen.width,h=screen.height;
  for(const b of state.bullets){
    const pos=gameToScreen(b.x,b.y,b.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row>=gameTop&&pos.row<gameBottom){
      screen.put(pos.col,pos.row,'\u2502',C.BRIGHT_CYAN,C.BLACK);
      if(pos.row-1>=gameTop)screen.put(pos.col,pos.row-1,'\u2502',C.CYAN,C.BLACK);
    }
  }
}

function drawParticles(screen,state,gameTop,gameBottom){
  const w=screen.width,h=screen.height;
  const particleChars=['*','+','\u00B7','.'];
  for(const p of state.particles){
    const pos=gameToScreen(p.x,p.y,p.z,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
    if(pos.row>=gameTop&&pos.row<gameBottom&&pos.col>=0&&pos.col<w){
      const fade=p.life/p.maxLife;
      const ch=particleChars[floor((1-fade)*(particleChars.length-1))];
      const color=fade>0.5?p.color:C.GRAY;
      screen.put(pos.col,pos.row,ch,color,C.BLACK);
    }
  }
}

// The ship's wings a quarter of a roll apart. The sprite is three cells wide,
// so the roll is told by the wings alone: the nose and body stay where they
// are, which is what a roll about the long axis actually does.
const ROLL_WINGS=[['<','>'],['\\','/'],['-','-'],['/','\\']];

// The wing pair for the roll the ship is in, level when it is in none. E reads
// the table forwards and Q reads it backwards, which mirrors the spin.
function rollWings(state){
  if(state.shipRoll<=0)return ROLL_WINGS[0];
  const turns=ROLL_WINGS.length;
  const elapsed=(ROLL_TIME-state.shipRoll)/ROLL_TIME;
  const step=min(turns-1,max(0,floor(elapsed*turns)));
  return state.rollDir<0?ROLL_WINGS[(turns-step)%turns]:ROLL_WINGS[step];
}

function drawShip(screen,state,gameTop,gameBottom){
  const w=screen.width,h=screen.height;
  const pos=gameToScreen(state.shipX,state.shipY,0,w,h,gameTop,gameBottom,state.tunnelRadius,state.maxViewZ);
  const cx=pos.col,cy=pos.row;
  // Mid-roll the wings turn and the hull goes white, so the invincibility the
  // roll grants is visible rather than something the player has to remember.
  const rolling=state.shipRoll>0;
  const [leftWing,rightWing]=rollWings(state);
  const hullColor=rolling?C.BRIGHT_WHITE:C.BRIGHT_CYAN;
  const wingColor=rolling?C.BRIGHT_MAGENTA:C.BRIGHT_BLUE;
  if(cy-1>=gameTop&&cy+1<gameBottom){
    screen.put(cx,cy-1,'\u25B2',hullColor,C.BLACK);
    screen.put(cx-1,cy,leftWing,wingColor,C.BLACK);
    screen.put(cx,cy,'\u2588',hullColor,C.BLACK);
    screen.put(cx+1,cy,rightWing,wingColor,C.BLACK);
    screen.put(cx-1,cy+1,'\u2568',C.CYAN,C.BLACK);
    screen.put(cx+1,cy+1,'\u2568',C.CYAN,C.BLACK);
    const engineGlow=sin(state.time*20)>0;
    const glowColor=state.boosting?C.BRIGHT_MAGENTA:C.BRIGHT_BLUE;
    if(engineGlow&&cy+2<gameBottom){
      screen.put(cx-1,cy+2,'\u2502',glowColor,C.BLACK);
      screen.put(cx+1,cy+2,'\u2502',glowColor,C.BLACK);
    }
  }
}

function drawHUD(screen,state){
  const w=screen.width;
  screen.put(0,0,'\u2554',C.CYAN,C.BLACK);
  screen.hLine(1,0,w-2,'\u2550',C.CYAN,C.BLACK);
  screen.put(w-1,0,'\u2557',C.CYAN,C.BLACK);
  const title=' SPACE RIDER ';
  const titleX=floor((w-title.length)/2);
  screen.putString(titleX,0,title,C.BRIGHT_CYAN,C.BLACK);
  screen.put(0,1,'\u2551',C.CYAN,C.BLACK);
  screen.put(w-1,1,'\u2551',C.CYAN,C.BLACK);
  const scoreStr=state.debugMode==='obstacleCollision'||state.debugMode==='mineCollision'
    ?'SCORE: ---':`SCORE: ${state.score}`;
  const distStr=`DIST: ${(state.distance/10).toFixed(1)} km`;
  const shieldStr=`SHIELD: ${Math.round(state.shield)}%`;
  screen.putString(2,1,scoreStr,C.BRIGHT_CYAN,C.BLACK);
  screen.putStringCenter(1,distStr,C.BRIGHT_MAGENTA,C.BLACK);
  screen.putString(w-shieldStr.length-2,1,shieldStr,
    state.shield<30?C.BRIGHT_RED:C.BRIGHT_GREEN,C.BLACK);
  screen.put(0,2,'\u2551',C.CYAN,C.BLACK);
  screen.put(w-1,2,'\u2551',C.CYAN,C.BLACK);
  const barWidth=w-4;
  const barStart=2;
  const filled=floor(barWidth*state.shield/100);
  const barColor=state.shield<30?C.BRIGHT_RED:C.BRIGHT_GREEN;
  for(let i=0;i<barWidth;i++){
    if(i<filled)screen.put(barStart+i,2,'\u2588',barColor,C.BLACK);
    else screen.put(barStart+i,2,'\u2591',C.GRAY,C.BLACK);
  }
  // Combo counter, left-aligned on the row the debug label and the NEW BEST
  // banner centre themselves on, so the three never collide. A lone kill is
  // worth its face value and puts nothing on screen; the chain starts at x2.
  if(state.combo>=2){
    const combo=`COMBO x${state.combo}`;
    const comboColor=state.combo>=6?C.BRIGHT_MAGENTA
      :state.combo>=4?C.BRIGHT_YELLOW
      :C.BRIGHT_CYAN;
    screen.putString(2,HUD_ROWS,combo,comboColor,C.BLACK);
  }

  if(state.debugMode&&state.mode==='playing'){
    const label=`[ DEBUG: ${DEBUG_MODE_NAMES[state.debugMode]} ]`;
    screen.putStringCenter(HUD_ROWS,label,C.BRIGHT_MAGENTA,C.BLACK);
    if(state.debugMode==='obstacleCollision'||state.debugMode==='mineCollision'){
      const tracker=`Collisions: ${state.trackerCount}`;
      screen.putString(w-tracker.length-2,HUD_ROWS,tracker,C.BRIGHT_GREEN,C.BLACK);
    }else if(state.debugMode==='chaos'){
      const tracker=`Destruction: ${state.trackerCount}`;
      screen.putString(w-tracker.length-2,HUD_ROWS,tracker,C.BRIGHT_GREEN,C.BLACK);
    }
  }

  // NEW BEST banner. It only fires on normal runs, so it never shares this row
  // with the debug label above.
  if(state.newBestFlash>0){
    const blink=sin(state.uiTime*10)>0;
    screen.putStringCenter(HUD_ROWS,'[ NEW BEST ]',blink?C.BRIGHT_YELLOW:C.BRIGHT_WHITE,C.BLACK);
  }
}

function drawFooter(screen,state){

function drawEffects(screen,state){

// ===== Menu Rendering (port of menu.ts) =====

const TITLE_ART=[
  ' ___  ___   _   ___ ___   ___ ___ ___  ___ ___ ',
  '/ __|/ _ \\ / \\ / __| __| | _ \\_ _|   \\| __| _ \\',
  '\\__ \\ ___// _ \\ (_| _|  |   /| || |) | _||   /',
  '|___/|_| /_/ \\_\\___|___| |_|_\\___|___/|___|_|_\\',
];

// One way of laying the debug menu out vertically. The fullest form needs 25
// rows and the documented minimum screen is 20, so the parts that can be given
// up are listed in the order they are given up: the blank row between entries
// first, then the per-mode description, then the title art. The five modes and
// the navigation hint are what the screen is for, and are never dropped.
const DEBUG_MENU_VARIANTS=[
  {art:true,stride:3,desc:true,bracket:true},
  {art:true,stride:2,desc:true,bracket:false},
  {art:true,stride:1,desc:false,bracket:false},
  {art:false,stride:2,desc:true,bracket:false},
  {art:false,stride:1,desc:false,bracket:false},
];

// Rows a variant occupies, from its first drawn row to its last list row.
function debugMenuBlockRows(variant){
  const head=variant.art?TITLE_ART.length+1:0;  // art plus the blank under it
  const gap=variant.bracket?2:1;                // blank rows under the subtitle
  const list=(DEBUG_MODES.length-1)*variant.stride+(variant.desc?2:1);
  return head+1+gap+list;                       // + the subtitle row
}

// Pick the fullest layout that fits between the borders, then place it. Every
// row the menu draws is derived from the result, so nothing lands past the
// bottom border to be silently dropped by ScreenBuffer.put.
function debugMenuLayout(h){
  const top=1,bottom=h-2;
  let variant=DEBUG_MENU_VARIANTS[DEBUG_MENU_VARIANTS.length-1];
  let blockRows=debugMenuBlockRows(variant);
  for(const candidate of DEBUG_MENU_VARIANTS){
    variant=candidate;
    blockRows=debugMenuBlockRows(candidate);
    if(blockRows<=bottom-top)break;
  }
  // Keep the familiar placement while there is room for it, and slide the block
  // up against the top border once there is not.
  const artY=max(top,min(floor(h*0.12),bottom-blockRows));
  const subY=artY+(variant.art?TITLE_ART.length+1:0);
  const menuY=subY+1+(variant.bracket?2:1);
  // The hint keeps its usual row below the list, clamped to the last row inside
  // the border so a short screen shortens the gap rather than losing the line.
  const navY=min(menuY+DEBUG_MODES.length*variant.stride+1,bottom);
  return{...variant,artY,subY,menuY,navY};
}

// True when a row is inside the border and may be drawn on.
function insideBorder(y,h){return y>=1&&y<=h-2;}

function renderTitleScreen(screen,state){
  const w=screen.width,h=screen.height;
  screen.clear(C.BLACK);
  // Starfield background, drawn first so the text sits on top of it
  drawMenuStars(screen,state,w,h);
  drawBorder(screen,w,h);
  const artY=floor(h*0.15);
  for(let i=0;i<TITLE_ART.length;i++){
    const line=TITLE_ART[i];
    if(line.length<w-4){
      const pulse=sin(state.time*2+i*0.3)*0.5+0.5;
      const color=pulse>0.5?C.BRIGHT_CYAN:C.CYAN;
      screen.putStringCenter(artY+i,line,color,C.BLACK);
    }
  }
  const subY=artY+TITLE_ART.length+2;
  const subtitle='WARP TUNNEL PROTOCOL v2.7';
  const subPulse=sin(state.time*1.5)*0.5+0.5;
  screen.putStringCenter(subY,subtitle,subPulse>0.5?C.BRIGHT_MAGENTA:C.MAGENTA,C.BLACK);
  const instY=subY+3;
  const instructions=[
    ['WASD',' or ','ARROWS',' \u2014 steer ship'],
    ['F',' \u2014 boost  |  ','SPACE',' \u2014 fire pulse cannon'],
    ['Q / E',' \u2014 barrel roll'],
    ['','Dodge obstacles \u2022 Collect energy orbs \u2022 Survive!','',''],
  ];
  for(let i=0;i<instructions.length;i++){
    const parts=instructions[i];
    let line='';for(const p of parts)line+=p;
    const x=floor((w-line.length)/2);
    let cx=x;
    for(let j=0;j<parts.length;j++){
      const color=j%2===0&&parts[j].length>0?C.BRIGHT_CYAN:C.GRAY;
      screen.putString(cx,instY+i,parts[j],color,C.BLACK);
      cx+=parts[j].length;
    }
  }
  // Start prompt (pulsing), clamped to the last row inside the border: at the
  // documented 60x20 minimum its usual row is the bottom border itself.
  const promptY=min(instY+instructions.length+3,h-2);
  const prompt='[ PRESS ENTER TO LAUNCH ]';
  const promptPulse=sin(state.time*3)*0.5+0.5;
  const promptColor=promptPulse>0.3?C.BRIGHT_GREEN:C.GREEN;
  screen.putStringCenter(promptY,prompt,promptColor,C.BLACK);
}

function renderDebugMenu(screen,state){
  const w=screen.width,h=screen.height;
  screen.clear(C.BLACK);
  // Starfield background, drawn first so the text sits on top of it
  drawMenuStars(screen,state,w,h);
  drawBorder(screen,w,h);
  const layout=debugMenuLayout(h);
  if(layout.art){
    for(let i=0;i<TITLE_ART.length;i++){
      const y=layout.artY+i;
      if(TITLE_ART[i].length<w-4&&insideBorder(y,h))
        screen.putStringCenter(y,TITLE_ART[i],C.BRIGHT_CYAN,C.BLACK);
    }
  }
  if(insideBorder(layout.subY,h))
    screen.putStringCenter(layout.subY,'DEBUG PROTOCOL v0.1',C.BRIGHT_MAGENTA,C.BLACK);
  for(let i=0;i<DEBUG_MODES.length;i++){
    const mode=DEBUG_MODES[i];
    const selected=i===state.debugMenuSelected;
    const prefix=`[${i+1}] `;
    const name=DEBUG_MODE_NAMES[mode];
    const desc=`    ${DEBUG_MODE_DESCS[mode]}`;
    const y=layout.menuY+i*layout.stride;
    const x=floor((w-40)/2);
    if(!insideBorder(y,h))continue;

    screen.putString(x+prefix.length,y,name,selected?C.BRIGHT_CYAN:C.GRAY,C.BLACK);
    if(layout.desc&&insideBorder(y+1,h))
      screen.putString(x,y+1,desc,selected?C.CYAN:C.GRAY,C.BLACK);
    if(selected&&layout.bracket&&insideBorder(y-1,h)){
      const bw=42,bx=x-2;
      screen.put(bx,y-1,'\u250C',C.CYAN,C.BLACK);
      screen.hLine(bx+1,y-1,bw,'\u2500',C.CYAN,C.BLACK);
      screen.put(bx+bw+1,y-1,'\u2510',C.CYAN,C.BLACK);
    }
  }
  if(insideBorder(layout.navY,h)){
    const navPulse=sin(state.time*3)*0.5+0.5;
    screen.putStringCenter(layout.navY,'[ \u2191\u2193 SELECT \u2022 ENTER LAUNCH ]',
      navPulse>0.3?C.BRIGHT_GREEN:C.GREEN,C.BLACK);
  }
}

function drawBorder(screen,w,h){
  screen.put(0,0,'\u2554',C.CYAN,C.BLACK);
  screen.hLine(1,0,w-2,'\u2550',C.CYAN,C.BLACK);

function drawMenuStars(screen,state,w,h){
  for(const star of state.stars){
    const sy=star.y%h;
    const y=floor(sy<0?sy+h:sy);
    const x=floor(star.x)%w;
    if(y>0&&y<h-1&&x>0&&x<w-1)
      screen.put(x,y,star.char,star.color,C.BLACK);
  }
}

// ===== Sound (Web Audio) =====
// Every cue is synthesized on the spot: there are no audio files to fetch, so
// nothing to load before a run and nothing to keep in step with the build.

// The one-shot cues, each a frequency sweep under a decaying envelope. The shot
// and the mine sweep down, the orb chimes up, and damage is the lowest and
// longest of the four so it reads as a hit rather than as another pickup.
const SOUND_CUES={
  shot:  {wave:'square',  from:900,to:180, dur:0.10,gain:0.05},
  orb:   {wave:'sine',    from:660,to:1400,dur:0.18,gain:0.06},
  damage:{wave:'sawtooth',from:220,to:50,  dur:0.30,gain:0.09},
  mine:  {wave:'square',  from:180,to:28,  dur:0.45,gain:0.10},
};

// The engine hum. Its pitch is this note times the speed readout the HUD shows,
// so what is heard and what is read move together and a boost is audible.
const ENGINE_BASE_HZ=55;
const ENGINE_GAIN=0.03;

class RetroAudio{
  constructor(makeContext){
    this.makeContext=makeContext;
    this.ctx=null;
    this.engine=null;
    this.failed=false;
  }
  // The context is built on the first cue rather than at startup, and only once:
  // a browser that refuses one outright leaves the game silent instead of
  // throwing every frame.
  context(){
    if(this.ctx||this.failed)return this.ctx;
    try{this.ctx=this.makeContext()}catch(e){this.failed=true}
    return this.ctx;
  }
  // The context, but only when it is actually running, which is the only state
  // worth scheduling against. A browser that will not start one before the page
  // has been touched hands back a suspended context, and a suspended context's
  // clock sits at 0: everything play() schedules reads that clock, so every cue
  // raised beforehand would be scheduled for the same instant at full gain and
  // the whole backlog would sound together the moment the context woke - which
  // is what a `?mode=` link, whose run is under way before anything has been
  // pressed, used to open with. Those cues were never going to be audible, so
  // they are dropped here instead of queued.
  //
  // Reading the state rather than waiting for the keypress is what keeps a
  // browser that allows the sound outright - a high Media Engagement Index, or
  // the site given Sound: Allow - playing the run from its first frame. It hands
  // back a context already running, on a clock that advances, and there is
  // nothing for a gesture to add.
  live(){
    const ctx=this.context();
    return ctx&&ctx.state==='running'?ctx:null;
  }
  // The page's first keypress, from the keydown handler: the gesture a blocked
  // browser is waiting for. Harmless on a context already running, and on a
  // browser that has no context to give.
  resume(){
    const ctx=this.context();
    if(ctx&&ctx.state==='suspended'&&ctx.resume)ctx.resume();
  }
  play(name){
    const spec=SOUND_CUES[name];
    if(!spec)return;
    const ctx=this.live();
    if(!ctx)return;
    const t=ctx.currentTime;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type=spec.wave;
    osc.frequency.setValueAtTime(spec.from,t);
    osc.frequency.exponentialRampToValueAtTime(spec.to,t+spec.dur);
    gain.gain.setValueAtTime(spec.gain,t);
    // Ramping to silence rather than stopping on a live gain is what keeps the
    // tail off; an exponential ramp cannot reach zero, so it lands just under.
    gain.gain.exponentialRampToValueAtTime(0.0001,t+spec.dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t+spec.dur);
  }
  // The hum runs for as long as the run does. Starting and stopping it every
  // frame would click, so it is held open and only its frequency moves.
  engineOn(speedMultiple){
    const ctx=this.live();
    if(!ctx)return;
    if(!this.engine){
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='triangle';
      gain.gain.setValueAtTime(ENGINE_GAIN,ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      this.engine={osc,gain};
    }
    this.engine.osc.frequency.setValueAtTime(ENGINE_BASE_HZ*speedMultiple,ctx.currentTime);
  }
  engineOff(){
    if(!this.engine)return;
    this.engine.osc.stop(this.ctx.currentTime);
    this.engine.osc.disconnect();
    this.engine.gain.disconnect();
    this.engine=null;
  }
  // Play out one frame: the cues the engine queued, then the hum, which runs
  // only while a run is actually advancing. Mute silences all of it.
  frame(state){
    if(state.muted){this.engineOff();return}
    for(const cue of state.sounds)this.play(cue);
    if(state.mode==='playing'&&!state.paused)this.engineOn(state.speed/BASE_SPEED_START);
    else this.engineOff();
  }
}

// ===== Canvas Setup & Sizing =====
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

const FONT_SIZE=16;
const FONT=`${FONT_SIZE}px 'Courier New', 'Consolas', monospace`;
let cellW,cellH;

function measureCell(){
  ctx.font=FONT;
  const m=ctx.measureText('M');
  cellW=Math.ceil(m.width);
  cellH=FONT_SIZE+2;
}

let termWidth,termHeight;
let screen;
const game=new Game();

const MIN_WIDTH=60;
const MIN_HEIGHT=20;

function handleResize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  measureCell();
  termWidth=max(MIN_WIDTH,floor(canvas.width/cellW));
  termHeight=max(MIN_HEIGHT,floor(canvas.height/cellH));
  screen=new ScreenBuffer(termWidth,termHeight);
  game.initStars(termWidth,termHeight);
  game.state.screenWidth=termWidth;
  game.state.screenHeight=termHeight;
}

window.addEventListener('resize',handleResize);
handleResize();

// ===== Input handling =====
const keys={};
const justPressed={};

function mapKey(e){
  switch(e.code){
    case'ArrowUp':return'UP';case'ArrowDown':return'DOWN';
    case'ArrowLeft':return'LEFT';case'ArrowRight':return'RIGHT';
    case'KeyW':return'W';case'KeyA':return'A';case'KeyS':return'S';case'KeyD':return'D';
    case'KeyQ':return'Q';case'KeyE':return'E';case'KeyF':return'F';
    case'KeyP':return'P';case'KeyM':return'M';case'KeyC':return'C';
    case'Space':return'SPACE';case'Enter':return'ENTER';
    case'Escape':return'ESCAPE';case'Tab':return'TAB';
    case'ShiftLeft':case'ShiftRight':return'SHIFT';
    case'Digit1':return'DIGIT_1';case'Digit2':return'DIGIT_2';
    case'Digit3':return'DIGIT_3';case'Digit4':return'DIGIT_4';
    case'Digit5':return'DIGIT_5';
    default:return null;
  }
}

window.addEventListener('keydown',e=>{
  const k=mapKey(e);
  if(k){
    e.preventDefault();
    audio.resume();
    if(!keys[k])justPressed[k]=true;
    keys[k]=true;
  }
});
window.addEventListener('keyup',e=>{
  const k=mapKey(e);
  if(k){e.preventDefault();keys[k]=false}
});

// ===== Main loop =====
let lastTime=performance.now();
const TARGET_FPS=30;
const FRAME_MS=1000/TARGET_FPS;
let accumulator=0;

function frame(now){
  requestAnimationFrame(frame);
  const elapsed=now-lastTime;
  lastTime=now;
  accumulator+=elapsed;
  if(accumulator<FRAME_MS)return;
  accumulator-=FRAME_MS;
  if(accumulator>FRAME_MS*2)accumulator=0; // prevent spiral

  const dt=min(FRAME_MS/1000,0.05);

  // Handle menu input
  game.handleMenuInput(justPressed);

  // C toggles the CRT overlay. It is a property of the page rather than of the
  // game, so it lives here beside the element it drives, and the choice is
  // written through so a refresh comes back the way the player left it.
  if(justPressed.C){
    crtOn=!crtOn;
    saveCrt(crtOn);
    applyCrt();
  }

  // ESC
  if(justPressed.ESCAPE){
    if(game.state.mode==='playing'||game.state.mode==='dead'||game.state.mode==='debugMenu'){
      game.state.mode='menu';
    }
  }

  // Update
  game.update(dt,keys,justPressed);

  // Play out the frame the engine just simulated. It names the events; what
  // they sound like is the audio layer's business.
  audio.frame(game.state);

  // Clear canvas
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Render to screen buffer
  switch(game.state.mode){
    case'menu':renderTitleScreen(screen,game.state);break;
    case'debugMenu':renderDebugMenu(screen,game.state);break;
    case'playing':renderGame(screen,game.state);break;
    case'dead':renderGameOver(screen,game.state);break;
  }

  // Flush screen buffer to canvas, jolted by the damage shake. Translating the
  // whole grid leaves black at the edges, which is the shake reading as impact.
  const shake=shakeOffset(game.state);
  ctx.save();
  ctx.translate(shake.x,shake.y);
  screen.render(ctx,cellW,cellH,FONT);
  ctx.restore();

  // Clear justPressed
  for(const k of Object.keys(justPressed))delete justPressed[k];
}

requestAnimationFrame(frame);
</script>
